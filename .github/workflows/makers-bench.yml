name: Build both Maker's Bench books
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'makers-bench/**'
      - 'tools/makers-bench/**'
      - 'tools/build-makers-bench.py'
      - 'book-pager.js'
      - 'table-books-worker.js'
      - 'shelf-art/bench.jpg'
permissions:
  contents: write
  pages: write
concurrency:
  group: makers-bench-editions
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/build-makers-bench.py
      - name: Save updated editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add makers-bench/index.html makers-bench/sw.js makers-bench-desktop downloads/makers-bench-desktop.zip index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh both Maker's Bench editions and desktop download"
            git push origin HEAD:main
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
