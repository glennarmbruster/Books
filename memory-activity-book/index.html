<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263e50"><title>Memory Activity Book · Books</title>
<link rel="icon" href="../shelf-art/memory.jpg"><link rel="stylesheet" href="../table-books.css"><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../">‹ Bookshelf</a><span id="offline" role="status"></span></header><main>
<section id="directory"><div class="mast"><img src="../shelf-art/memory.jpg" alt=""><div><h1>Memory Activity Book</h1><p>Match a pair, remember a scene, or retrace a pattern. Pick the same activity number to play together.</p></div></div>
<div class="toolbar"><label>Activity type <select id="filter"><option value="">All activities</option></select></label><span id="progress"></span></div>
<book-number-jump noun="activity" max="250"></book-number-jump><div class="entries" id="entries"></div><div class="reader-actions"><button id="clear-all">Clear book progress</button></div></section>
<section id="reader" hidden><a class="back" href="#contents">‹ Activity index</a><p id="kind" class="eyebrow"></p><h1 id="title" tabindex="-1"></h1><div id="stage"></div><p id="feedback" role="status"></p><div class="reader-actions"><button id="restart">Restart activity</button></div><book-pager top></book-pager></section>
<p role="status" id="save-error"></p>
</main><dialog id="lock" aria-labelledby="lock-title"><form id="pin-form"><h2 id="lock-title"></h2><p id="pin-info"></p><label>PIN<input id="pin" inputmode="numeric" type="password" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label><label id="confirm-label">Confirm PIN<input id="confirm" inputmode="numeric" type="password" maxlength="8"></label><p id="pin-error" role="status"></p><div class="reader-actions"><button class="action" id="accept">Set PIN</button><button type="button" id="cancel-pin">Cancel</button></div></form></dialog>
<script src="../book-pager.js"></script><script src="stories.js"></script><script src="travel-stories.js"></script><script src="neighborhood-stories.js"></script><script src="extra-outings.js"></script><script src="word-pairs.js"></script><script src="category-recall.js"></script><script src="activities.js"></script><script src="../book-number.js"></script><script src="app.js"></script><script src="../table-books-offline.js"></script></body></html>
