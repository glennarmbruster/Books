<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 336" stroke-linecap="round" stroke-linejoin="round"><title>Cross the left working cord</title><desc>Cross the left working cord. Keep the two center fillers straight. Lay the left cord over them. Pass the right cord over its tail, behind the fillers and up through the left loop. Reverse the crossing. Snug the first half. Start the second half with the right cord over the fillers and take the left cord through the right loop.</desc><rect width="332" height="336" fill="#faf6eb"/><g transform="translate(3 48.0)"><path d="M68 9V82M82 9V82" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M43 8Q10 48 35 48H120" fill="none" stroke="#92745a" stroke-width="4.0" /><path d="M108 8Q116 52 100 55H54Q27 55 36 37" fill="none" stroke="#a9c3a1" stroke-width="4.0" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cross the left</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">working cord</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Keep the two center</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">fillers straight. Lay the</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">left cord over them.</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Pass the right cord over</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">its tail, behind the fillers</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and up through the left</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">loop.</text><path d="M12 186H318" stroke="#d2d8cc"/><g transform="translate(3 216.0)"><path d="M68 9V82M82 9V82" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M106 8Q141 48 117 48H30" fill="none" stroke="#a9c3a1" stroke-width="4.0" /><path d="M43 8Q35 52 50 55H98Q123 55 115 37" fill="none" stroke="#92745a" stroke-width="4.0" /></g><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Reverse the</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">crossing</text><text x="164" y="250.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Snug the first half. Start</text><text x="164" y="268.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the second half with the</text><text x="164" y="286.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">right cord over the fillers</text><text x="164" y="304.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and take the left cord</text><text x="164" y="322.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">through the right loop.</text></svg>
