<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Shake off excess flour</title><desc>Shake off excess flour. An even dusting follows the cutlet’s contours. Brush or shake off thick patches before moving to the pan.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M12 56Q14 28 52 30Q75 42 51 59Q25 71 12 56ZM82 56Q85 28 122 30Q146 42 122 59Q96 71 82 56Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><circle cx="97" cy="46" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="105" cy="42" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="113" cy="44" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="120" cy="40" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="37" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Even</text><text x="110" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Clumped</text></g></svg>
