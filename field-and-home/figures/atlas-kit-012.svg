<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 244" stroke-linecap="round" stroke-linejoin="round"><title>Lift one edge</title><desc>Lift one edge. Looking into the bowl, lift the edge nearest you without tearing the dough. Lay it across. Fold the lifted flap over the middle. Turn the bowl a quarter turn and repeat around the dough.</desc><rect width="332" height="244" fill="#faf6eb"/><g transform="translate(3 11.5)"><circle cx="75" cy="46" r="39" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="75" cy="43" rx="29" ry="25" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M61 59Q77 55 86 59L80 81H62Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Lift one edge</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Looking into the bowl, lift</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the edge nearest you</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">without tearing the</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">dough.</text><path d="M12 113H318" stroke="#d2d8cc"/><g transform="translate(3 133.5)"><circle cx="75" cy="46" r="39" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="75" cy="46" rx="29" ry="25" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M58 60L66 34Q74 29 85 34L90 60Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><path d="M111.0 62.0L118.0 40.0M119.3 46.9L118.0 40.0l-5.1 4.8" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="139.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Lay it across</text><text x="164" y="158.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Fold the lifted flap over</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the middle. Turn the</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">bowl a quarter turn and</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">repeat around the</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">dough.</text></svg>
