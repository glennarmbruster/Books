<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Match the two snap halves</title><desc>Match the two snap halves. For a common four-part marine snap, the cap pairs with the socket on one panel. The stud pairs with the eyelet on the other.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M24 21Q42 9 62 21L49 23V33H39V23Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><rect x="15" y="36" width="56" height="5" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="43" cy="49" rx="14" ry="5" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M91 25H117V30H91Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><rect x="76" y="36" width="57" height="5" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M91 53H118L111 48V44H100V48Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><text x="42" y="76" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Socket</text><text x="105" y="76" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Stud</text></g></svg>
