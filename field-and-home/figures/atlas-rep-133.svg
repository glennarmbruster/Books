<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Check the ladder’s setup from the side</title><desc>Side view. The four-to-one triangle helps you see a ladder that is too steep or too shallow.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M20 8V78H138" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M22 14L39 78" fill="none" stroke="#92745a" stroke-width="4.0" /><path d="M21 14V78H39" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><text x="73" y="36" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650">4 up</text><text x="83" y="73" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650">1 out</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Side view</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The four-to-one triangle</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">helps you see a ladder</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">that is too steep or too</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shallow.</text></svg>
