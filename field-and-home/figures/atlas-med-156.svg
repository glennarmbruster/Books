<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Identify a single-use nasal spray</title><desc>Identify a single-use nasal spray. NARCAN nasal spray has a nozzle, finger rests and a plunger. Do not test it. Each device delivers one dose. Call 911 and follow the package and dispatcher.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M64 12H80L84 43H111V51H39V43H63Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><rect x="62" y="51" width="22" height="22" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="56" y="71" width="35" height="8" rx="3" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><path d="M123.0 17.0L84.0 23.0M89.6 18.7L84.0 23.0l6.6 2.4" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M125.0 70.0L93.0 74.0M98.7 69.9L93.0 74.0l6.5 2.6" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
