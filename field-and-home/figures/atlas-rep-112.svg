<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 131" stroke-linecap="round" stroke-linejoin="round"><title>Distinguish the tank drain from the relief valve</title><desc>Locate the drain. The drain is low on the tank. Trace the separate relief discharge pipe from its valve.</desc><rect width="332" height="131" fill="#faf6eb"/><g transform="translate(3 20.5)"><rect x="27" y="8" width="79" height="70" rx="10" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="34" y="65" width="18" height="8" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M51 71H64" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M105 20H120V74" fill="none" stroke="#b7d9d8" stroke-width="5.0" /><path d="M6.0 59.0L32.0 68.0M25.1 69.2L32.0 68.0l-4.7 -5.2" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M141.0 24.0L121.0 24.0M127.1 20.6L121.0 24.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Locate the drain</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The drain is low on the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">tank. Trace the</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">separate relief</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">discharge pipe from its</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">valve.</text></svg>
