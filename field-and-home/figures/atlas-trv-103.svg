<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Use the ship’s clock</title><desc>Use the ship’s clock. Example only. At the same instant the port clock reads 2 while ship time reads 3. Use the ship’s stated time for the return deadline.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><circle cx="39" cy="41" r="26" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="111" cy="41" r="26" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M39 20V41H58M111 20V41L127 30" fill="none" stroke="#223f3e" stroke-width="2" /><text x="39" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Ship 3:00</text><text x="111" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Port 2:00</text></g></svg>
