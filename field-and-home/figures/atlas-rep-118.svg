<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 216" stroke-linecap="round" stroke-linejoin="round"><title>Find the condenser access on your model</title><desc>Rear example. The coil grid is visible on the back panel. Lower-front example. The removable grille sits at floor level below the door.</desc><rect width="332" height="216" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="34" y="4" width="75" height="80" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M45 20h52v7H45v7h52v7H45v7h52v7H45v7h52" fill="none" stroke="#718d85" stroke-width="2" /><path d="M141.0 36.0L102.0 37.0M108.1 33.5L102.0 37.0l6.2 3.2" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="38.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Rear example</text><text x="164" y="57.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The coil grid is visible</text><text x="164" y="75.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">on the back panel.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 114.0)"><rect x="34" y="4" width="75" height="80" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M35 34H107" fill="none" stroke="#223f3e" stroke-width="2" /><rect x="37" y="69" width="68" height="11" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M43 73H99M43 77H99" fill="none" stroke="#fffdf7" stroke-width="2" /><path d="M141.0 62.0L108.0 73.0M112.8 67.9L108.0 73.0l6.9 1.2" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Lower-front</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">example</text><text x="164" y="166.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The removable grille</text><text x="164" y="184.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">sits at floor level below</text><text x="164" y="202.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the door.</text></svg>
