<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Locate and seat the Bosch tub filter</title><desc>Tub floor. The mesh cylinder sits in the fine-filter plate. Alignment marks. Turn the cylinder into its seated position until the two arrows face each other.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="16" y="8" width="121" height="74" rx="9" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="44" y="29" width="72" height="39" rx="6" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="78" cy="49" rx="15" ry="12" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M32 62L117 28" fill="none" stroke="#e7c99f" stroke-width="6.0" /><path d="M136.0 67.0L96.0 55.0M102.8 53.6L96.0 55.0l4.9 5.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="38.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Tub floor</text><text x="164" y="57.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The mesh cylinder sits</text><text x="164" y="75.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">in the fine-filter plate.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><ellipse cx="73" cy="48" rx="50" ry="29" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="73" cy="46" rx="28" ry="17" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M64 41H73L68 48Z" fill="#a9492b" stroke="#223f3e" stroke-width="1.8" /><path d="M63 62H73L68 54Z" fill="#223f3e" stroke="#223f3e" stroke-width="1.8" /><path d="M137.0 55.0L81.0 53.0M87.3 49.9L81.0 53.0l6.0 3.6" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Alignment marks</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Turn the cylinder into its</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">seated position until the</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">two arrows face each</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">other.</text></svg>
