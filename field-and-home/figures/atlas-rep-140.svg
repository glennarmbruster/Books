<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>See how the supply-hose washer seals</title><desc>Inside the nut. The internal washer lies between the nut’s shoulder and the end face of the fitting.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M16 28H78V35H32V54H78V62H16Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M62 36H71V53H62Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><path d="M77 30H136V38H80V51H136V59H77Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M107.0 8.0L69.0 32.0M72.4 25.9L69.0 32.0l7.0 -0.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Inside the nut</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The internal washer lies</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">between the nut’s</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shoulder and the end</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">face of the fitting.</text></svg>
