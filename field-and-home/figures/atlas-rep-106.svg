<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Map the house-side water control</title><desc>Trace the service. Follow the line from the meter toward the house to identify the house-side valve.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><g transform="translate(74 2) scale(.53)"><path d="M10 43L70 7 130 43H118V84H22V43Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="34" y="46" width="22" height="20" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="80" y="47" width="21" height="37" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><path d="M4 69H119V46" fill="none" stroke="#b7d9d8" stroke-width="6.0" /><circle cx="29" cy="68" r="12" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M92 69V54H106" fill="none" stroke="#a9492b" stroke-width="2" /><text x="29" y="88" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Meter</text><path d="M138.0 63.0L106.0 55.0M112.8 53.2L106.0 55.0l5.1 4.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Trace the service</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Follow the line from the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">meter toward the house</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">to identify the</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">house-side valve.</text></svg>
