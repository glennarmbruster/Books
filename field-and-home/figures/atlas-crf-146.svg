<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 430" stroke-linecap="round" stroke-linejoin="round"><title>Stop before the corner</title><desc>Stop before the corner. Finish the first seam one seam allowance before the corner. The dotted line is the stitching. Fold up, then down. Fold the free binding away on the diagonal. Fold it back along the next edge, keeping the top fold level with the first edge. Turn the miter. Turn the binding to the back. The diagonal corner fold meets the two straight bound edges.</desc><rect width="332" height="430" fill="#faf6eb"/><g transform="translate(3 30.0)"><rect x="14" y="15" width="108" height="60" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="14" y="15" width="108" height="13" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M15 22H114" fill="none" stroke="#223f3e" stroke-width="2" stroke-dasharray="4 4"/><circle cx="115" cy="22" r="3" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Stop before the</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">corner</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Finish the first seam</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">one seam allowance</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">before the corner. The</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">dotted line is the</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">stitching.</text><path d="M12 150H318" stroke="#d2d8cc"/><g transform="translate(3 179.5)"><rect x="14" y="24" width="98" height="52" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M14 24H101L117 8V73H105V36H14Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M101 24L114 37" fill="none" stroke="#92745a" stroke-width="2" stroke-dasharray="4 4"/><path d="M137.0 30.0L137.0 59.0M133.6 52.9L137.0 59.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Fold up, then down</text><text x="164" y="195.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Fold the free binding</text><text x="164" y="213.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">away on the diagonal.</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Fold it back along the</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">next edge, keeping the</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">top fold level with the</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">first edge.</text><path d="M12 299H318" stroke="#d2d8cc"/><g transform="translate(3 319.5)"><rect x="16" y="15" width="110" height="61" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M16 15H126V76H112V30H16Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M112 30L126 15" fill="none" stroke="#92745a" stroke-width="2" /></g><text x="164" y="325.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Turn the miter</text><text x="164" y="344.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Turn the binding to the</text><text x="164" y="362.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back. The diagonal</text><text x="164" y="380.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">corner fold meets the</text><text x="164" y="398.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">two straight bound</text><text x="164" y="416.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">edges.</text></svg>
