<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Inspect the pulled tip</title><desc>Inspect the pulled tip. Compare the end with your nozzle’s cavity. A complete imprint tapers to the outlet. A blunt or broken pull may leave debris behind.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M27 13H44V50L37 65H34L27 50ZM94 13H112V51L106 47 100 54 94 50Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><text x="39" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Full taper</text><text x="106" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Broken</text></g></svg>
