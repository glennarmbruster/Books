<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 132" stroke-linecap="round" stroke-linejoin="round"><title>Place the generator away from the house</title><desc>Outside and downwind. The distance is from the generator to the house. The exhaust arrow points away.</desc><rect width="332" height="132" fill="#faf6eb"/><g transform="translate(3 21.0)"><g transform="translate(-2 10) scale(.55)"><path d="M10 43L70 7 130 43H118V84H22V43Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="34" y="46" width="22" height="20" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="80" y="47" width="21" height="37" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><rect x="104" y="49" width="27" height="19" rx="3" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><circle cx="110" cy="71" r="3" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><circle cx="127" cy="71" r="3" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><path d="M129.0 46.0L148.0 35.0M144.4 41.0L148.0 35.0l-7.0 0.2" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M58 70H103" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><text x="81" y="84" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">20 ft +</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Outside and</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">downwind</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The distance is from the</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">generator to the house.</text><text x="164" y="100.0" text-anchor="start" fill="#223