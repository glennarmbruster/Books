<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 328" stroke-linecap="round" stroke-linejoin="round"><title>Make a U</title><desc>Make a U. Lay the rope in a U with both ends pointing away from you. Cross the ends. Bring the two free ends across each other above the loop and twist them once. Fold to the base. Fold the twisted ends down and press one onto each side of the lower curve.</desc><rect width="332" height="328" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M35 14Q37 77 73 75Q108 77 118 14" fill="none" stroke="#92745a" stroke-width="7.0" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Make a U</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Lay the rope in a U with</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">both ends pointing away</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">from you.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><path d="M104 12L60 34Q28 48 41 63Q73 91 102 62Q116 44 87 32L49 12" fill="none" stroke="#92745a" stroke-width="7.0" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cross the ends</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Bring the two free ends</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">across each other</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">above the loop and twist</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">them once.</text><path d="M12 215H318" stroke="#d2d8cc"/><g transform="translate(3 226.5)"><path d="M48 64Q87 45 91 24Q98 7 113 24Q141 64 78 76Q14 71 31 28Q45 1 59 24Q69 47 105 65" fill="none" stroke="#92745a" stroke-width="7.0" /></g><text x="164" y="241.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Fold to the base</text><text x="164" y="260.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Fold the twisted ends</text><text x="164" y="278.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">down and press one</text><text x="164" y="296.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">onto each side of the</text><text x="164" y="314.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lower curve.</text></svg>
