<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Check the protective strip</title><desc>Check the protective strip. An intact strip lies flat and covers the code. Lifted edges or tears are reasons to choose a different card.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="7" y="24" width="62" height="44" rx="5" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="15" y="38" width="45" height="12" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="81" y="24" width="62" height="44" rx="5" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M88 38H130L121 44 128 51H88Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><path d="M125.0 14.0L126.0 36.0M122.4 30.0L126.0 36.0l3.1 -6.3" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
