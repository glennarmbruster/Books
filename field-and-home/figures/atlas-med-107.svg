<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Look for a sudden change</title><desc>Look for a sudden change. A drooping smile or one arm drifting downward can be a stroke sign. Sudden balance, vision or speech trouble also warrants calling 911 immediately.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><circle cx="43" cy="43" r="25" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><circle cx="34" cy="37" r="2" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><circle cx="51" cy="37" r="2" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><path d="M30 49Q37 57 43 50L57 52" fill="none" stroke="#223f3e" stroke-width="2" /><circle cx="112" cy="27" r="9" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M112 38V66M111 43L84 40M113 43L139 54" fill="none" stroke="#718d85" stroke-width="5.0" /></g></svg>
