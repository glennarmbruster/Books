<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Call while cooling starts</title><desc>Call while cooling starts. Hot conditions plus confusion, collapse or altered behavior can signal heat stroke. One helper calls 911 as another starts rapid cooling.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(3 1) scale(.58)"><rect x="8" y="10" width="131" height="66" rx="7" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="15" y="16" width="117" height="52" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="48" y="29" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">911</text><rect x="89" y="41" width="44" height="17" rx="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><circle cx="96" cy="65" r="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><circle cx="107" cy="69" r="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><circle cx="119" cy="65" r="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M65.0 51.0L87.0 51.0M80.9 54.4L87.0 51.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
