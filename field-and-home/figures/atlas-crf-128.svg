<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Whipstitch</title><desc>Whipstitch. Wrap over the edge at each stitch. The face shows diagonal lines. Blanket stitch. Catch each loop along the edge. A linked line joins the upright stitches.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><g transform="translate(0 8) scale(1)"><rect x="10" y="20" width="130" height="52" rx="3" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M12 27H138M12 66H138" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/></g><path d="M22 29L38 47M45 29L61 47M68 29L84 47M91 29L107 47M114 29L130 47" fill="none" stroke="#92745a" stroke-width="3.0" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Whipstitch</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Wrap over the edge at</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">each stitch. The face</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shows diagonal lines.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><g transform="translate(0 8) scale(1)"><rect x="10" y="20" width="130" height="52" rx="3" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M12 27H138M12 66H138" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/></g><path d="M20 30H128M29 30V48M52 30V48M75 30V48M98 30V48M121 30V48" fill="none" stroke="#92745a" stroke-width="3.0" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Blanket stitch</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Catch each loop along</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the edge. A linked line</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">joins the upright</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">stitches.</text></svg>
