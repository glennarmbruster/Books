<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Match the packet to the water mark</title><desc>Match the packet to the water mark. Example for a packet labeled for one liter. Measure that exact volume of safe water and mix in the whole packet. Other packets may require different volumes.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="7" y="19" width="59" height="47" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="36" y="41" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">ORS</text><text x="36" y="55" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">1 liter</text><path d="M82 17H136L132 76H87Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><rect x="88" y="35" width="43" height="36" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M82 35H99" fill="none" stroke="#223f3e" stroke-width="2" /><text x="111" y="56" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">1 L</text></g></svg>
