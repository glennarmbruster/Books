<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Compare the tank level with the overflow</title><desc>Above the rim. Water can spill over the open tube even when the flapper is closed. Below the rim. If the tank refills intermittently below the rim, inspect the flapper seal.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="17" y="8" width="118" height="72" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="20" y="32" width="112" height="44" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M70 78V38H84V78" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M106.0 25.0L82.0 39.0M85.6 33.0L82.0 39.0l7.0 -0.2" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Above the rim</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Water can spill over the</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">open tube even when</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the flapper is closed.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><rect x="17" y="8" width="118" height="72" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="20" y="50" width="112" height="26" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M70 78V38H84V78" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><ellipse cx="55" cy="74" rx="13" ry="4" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><path d="M30.0 44.0L51.0 68.0M44.4 65.6L51.0 68.0l-1.5 -6.8" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Below the rim</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">If the tank refills</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">intermittently below the</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">rim, inspect the flapper</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">seal.</text></svg>
