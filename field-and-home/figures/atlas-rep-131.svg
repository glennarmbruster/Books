<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Identify the Honda GX160 carburetor stack</title><desc>Exploded section. The jet is up inside the body. The bowl fastener is a different part below it.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="43" y="7" width="57" height="19" rx="4" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M63 26H80V47H63Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="67" y="30" width="9" height="13" rx="1" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><path d="M37 54Q41 75 71 76Q104 74 108 54Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><rect x="63" y="80" width="17" height="6" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M126.0 23.0L81.0 36.0M86.0 31.1L81.0 36.0l6.8 1.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Exploded section</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The jet is up inside the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">body. The bowl fastener</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">is a different part below</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">it.</text></svg>
