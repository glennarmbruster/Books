<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Seat a burner cap level</title><desc>Stack the parts. The cap belongs on the matching burner head. The ceramic igniter stands beside it. Check the rim. Look across the cap at eye level for an even seating line.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 11.5)"><ellipse cx="68" cy="18" rx="35" ry="8" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="68" cy="48" rx="35" ry="10" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="68" cy="48" rx="10" ry="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="110" y="41" width="8" height="22" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M18 74H132" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M67.0 29.0L67.0 37.0M63.6 30.9L67.0 37.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Stack the parts</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The cap belongs on the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">matching burner head.</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The ceramic igniter</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">stands beside it.</text><path d="M12 113H318" stroke="#d2d8cc"/><g transform="translate(3 119.0)"><path d="M32 35Q72 27 112 35V41H32Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><rect x="36" y="42" width="72" height="18" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M16 41H129" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/></g><text x="164" y="142.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Check the rim</text><text x="164" y="161.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Look across the cap at</text><text x="164" y="179.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">eye level for an even</text><text x="164" y="197.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">seating line.</text></svg>
