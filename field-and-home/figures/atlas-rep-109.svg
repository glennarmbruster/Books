<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Face the slip-joint washer into the fitting</title><desc>Order on the tube. Slide the nut on first, then the washer. The wider mouth of the fitting receives the taper. Seated joint. The narrow edge enters the socket as the nut bears on the flat face.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M6 36H76V56H6" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><rect x="36" y="25" width="22" height="42" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M76 27L88 33V59L76 65Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><path d="M103 24L120 33H145V59H120L103 68V58L115 52V40L103 35Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M81.0 14.0L98.0 14.0M91.9 17.4L98.0 14.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Order on the tube</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Slide the nut on first,</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">then the washer. The</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">wider mouth of the fitting</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">receives the taper.</text><path d="M12 113H318" stroke="#d2d8cc"/><g transform="translate(3 119.0)"><path d="M5 39H118V55H5" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M77 22L116 30H147V38H110L82 32Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M77 70L116 62H147V54H110L82 60Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M69 29L96 37H69ZM69 65L96 57H69Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><path d="M53 32V22H80M53 62V72H80" fill="none" stroke="#92745a" stroke-width="2" /><path d="M31.0 9.0L69.0 27.0M62.0 27.4L69.0 27.0l-4.1 -5.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="142.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Seated joint</text><text x="164" y="161.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The narrow edge enters</text><text x="164" y="179.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the socket as the nut</text><text x="164" y="197.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">bears on the flat face.</text></svg>
