<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Find the pasteurization statement</title><desc>Find the pasteurization statement. Look for the word “pasteurized” on the actual carton before using eggs in a preparation that stays uncooked.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="76" y="34" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Liquid eggs</text><rect x="23" y="43" width="105" height="23" rx="2" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><text x="76" y="59" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650">Pasteurized</text></g></svg>
