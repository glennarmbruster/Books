<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Bisect the angle</title><desc>Bisect the angle. Approximation for northern temperate latitudes using local standard time. Point the hour hand at the sun. Halfway to twelve approximates south. Verify with a map or compass.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><circle cx="72" cy="47" r="38" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="72" y="20" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">12</text><path d="M72 47V23" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M72 47L99 46" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M73.0 46.0L94.0 24.0M92.2 30.8L94.0 24.0l-6.7 2.1" fill="none" stroke="#a9492b" stroke-width="2" /><text x="124" y="23" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">South</text></g></svg>
