<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 520" stroke-linecap="round" stroke-linejoin="round"><title>Responsive adult or child</title><desc>Responsive adult or child. For severe choking, send someone to call 911. Lean the person forward for five back blows, then give five abdominal thrusts. Use chest thrusts when indicated. Infant face-down. Support the jaw, head and neck on your forearm. Keep the head lower than the chest for five blows between the shoulder blades. Infant face-up. Support the head and turn the infant as one unit. Keep the head lower. Give five chest thrusts on the breastbone with the heel of one hand.</desc><rect width="332" height="520" fill="#faf6eb"/><g transform="translate(3 57.0)"><circle cx="75" cy="19" r="10" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M70 32L54 55 66 77M65 39L91 51" fill="none" stroke="#718d85" stroke-width="9.0" /><path d="M24.0 26.0L57.0 38.0M50.1 39.1L57.0 38.0l-4.6 -5.3" fill="none" stroke="#a9492b" stroke-width="2" /><text x="116" y="76" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">5 + 5</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Responsive adult</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">or child</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For severe choking,</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">send someone to call</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">911. Lean the person</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">forward for five back</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">blows, then give five</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">abdominal thrusts. Use</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">chest thrusts when</text><text x="164" y="190.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">indicated.</text><path d="M12 204H318" stroke="#d2d8cc"/><g transform="translate(3 233.5)"><path d="M20 60L120 37" fill="none" stroke="#d1a486" stroke-width="9.0" /><ellipse cx="79" cy="40" rx="27" ry="12" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="43" cy="53" r="12" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M78.0 7.0L71.0 27.0M69.9 20.1L71.0 27.0l5.2 -4.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Infant face-down</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Support the jaw, head</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and neck on your</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">forearm. Keep the head</text><text x="164" y="303.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lower than the chest for</text><text x="164" y="321.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">five blows between the</text><text x="164" y="339.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shoulder blades.</text><path d="M12 353H318" stroke="#d2d8cc"/><g transform="translate(3 391.5)"><path d="M20 64L123 39" fill="none" stroke="#d1a486" stroke-width="9.0" /><ellipse cx="79" cy="43" rx="28" ry="12" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="43" cy="55" r="12" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><circle cx="40" cy="49" r="1.5" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><path d="M70.0 13.0L70.0 37.0M66.6 30.9L70.0 37.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="379.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Infant face-up</text><text x="164" y="398.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Support the head and</text><text x="164" y="416.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">turn the infant as one</text><text x="164" y="434.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">unit. Keep the head</text><text x="164" y="452.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lower. Give five chest</text><text x="164" y="470.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">thrusts on the</text><text x="164" y="488.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">breastbone with the heel</text><text x="164" y="506.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">of one hand.</text></svg>
