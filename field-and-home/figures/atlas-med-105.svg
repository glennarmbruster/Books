<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 352" stroke-linecap="round" stroke-linejoin="round"><title>Set up the turn</title><desc>Set up the turn. For an unresponsive person breathing normally, follow dispatcher advice. Place the far hand at the cheek and bend the far knee. Keep monitoring breathing. Roll toward you. Support the hand at the cheek and draw the raised knee toward you. Let the upper knee steady the person on their side, with the airway open.</desc><rect width="332" height="352" fill="#faf6eb"/><g transform="translate(3 47.5)"><circle cx="30" cy="46" r="11" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M45 46L82 46" fill="none" stroke="#718d85" stroke-width="9.0" /><path d="M49 40L48 23 34 37M83 41L105 22 132 43" fill="none" stroke="#92745a" stroke-width="5.0" /><path d="M51 50L51 68 32 69M83 51L132 58" fill="none" stroke="#718d85" stroke-width="4.0" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Set up the turn</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For an unresponsive</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">person breathing</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">normally, follow</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">dispatcher advice.</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Place the far hand at the</text><text x="164" y="135.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cheek and bend the far</text><text x="164" y="153.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">knee. Keep monitoring</text><text x="164" y="171.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">breathing.</text><path d="M12 185H318" stroke="#d2d8cc"/><g transform="translate(3 223.5)"><circle cx="31" cy="51" r="11" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M46 50L82 50" fill="none" stroke="#718d85" stroke-width="9.0" /><path d="M48 53L56 65 33 59M83 51L100 72 129 65" fill="none" stroke="#92745a" stroke-width="5.0" /><path d="M83 48L132 51" fill="none" stroke="#718d85" stroke-width="4.0" /><path d="M97.0 19.0L101.0 40.0M96.6 34.6L101.0 40.0l2.1 -6.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="211.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Roll toward you</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Support the hand at the</text><text x="164" y="248.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cheek and draw the</text><text x="164" y="266.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">raised knee toward you.</text><text x="164" y="284.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Let the upper knee</text><text x="164" y="302.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">steady the person on</text><text x="164" y="320.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">their side, with the</text><text x="164" y="338.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">airway open.</text></svg>
