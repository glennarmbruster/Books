<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Remove constricting items</title><desc>Remove constricting items. A ring, watch or tight cuff can become trapped as swelling increases. Remove them early when this can be done easily and get urgent help.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><path d="M7 40Q43 40 87 34L112 23 118 25 111 33 136 34Q143 39 135 42L141 45Q143 50 134 51L136 55 121 60 94 55Q45 62 7 65Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /></g><rect x="68" y="37" width="8" height="18" rx="1" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M121 35V41" fill="none" stroke="#e5ae62" stroke-width="2" /><path d="M37.0 16.0L67.0 34.0M60.0 33.7L67.0 34.0l-3.5 -6.0" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M137.0 15.0L124.0 32.0M125.1 25.1L124.0 32.0l6.4 -2.8" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
