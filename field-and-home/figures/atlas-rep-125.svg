<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Feather a mesh patch into the wall</title><desc>Cross section. The mesh bridges the hole. The finishing coat tapers out on both sides.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="4" y="51" width="54" height="26" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="92" y="51" width="55" height="26" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M38 48H111" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M8 51Q72 24 142 51Q74 40 8 51Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M58 52V74M91 52V74" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cross section</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The mesh bridges the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">hole. The finishing coat</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">tapers out on both</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">sides.</text></svg>
