<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Direct runoff away</title><desc>Direct runoff away. For a chemical splash to one eye, start gentle flushing at once. Tilt the affected side down so runoff flows away from the other eye. Seek urgent guidance.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M24 43Q57 10 90 29Q119 38 127 66L117 77Q64 42 24 43Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><ellipse cx="52" cy="35" rx="7" ry="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="99" cy="56" rx="8" ry="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M73.0 33.0L97.0 50.0M90.0 49.2L97.0 50.0l-3.1 -6.3" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M107.0 61.0L133.0 75.0M126.0 75.0L133.0 75.0l-3.8 -5.9" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
