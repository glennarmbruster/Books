<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Bridge a suitable shallow cut</title><desc>Bridge a suitable shallow cut. Only use closure strips on a clean, minor cut with easily meeting edges. Seek care for bites, punctures, deep, gaping, contaminated or infected wounds.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="9" y="17" width="133" height="58" rx="8" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M21 46Q44 42 73 46T133 45" fill="none" stroke="#92745a" stroke-width="2" /><rect x="42" y="29" width="9" height="32" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="69" y="29" width="9" height="32" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="97" y="29" width="9" height="32" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M73.0 10.0L73.0 26.0M69.6 19.9L73.0 26.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
