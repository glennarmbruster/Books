<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read the battery indicator</title><desc>Read the battery indicator. Inogen Rove 6 example. On battery power the display estimates remaining charge or running time. Ask the supplier how to plan for a low-battery alarm.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="12" y="15" width="126" height="60" rx="5" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="24" y="23" width="64" height="23" rx="3" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="28" y="28" width="10" height="13" rx="1" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="42" y="28" width="10" height="13" rx="1" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="56" y="28" width="10" height="13" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="70" y="28" width="10" height="13" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="109" y="39" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">50%</text><text x="76" y="65" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Rove 6 · example</text></g></svg>
