<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 339" stroke-linecap="round" stroke-linejoin="round"><title>Lift and stretch</title><desc>Lift and stretch. Pull one folded end away from the rest of the warm curd to make a glossy band. Fold back. Bring the extended end back over the thicker end before stretching again. Tuck underneath. Gather loose edges under the ball so the upper surface is smooth.</desc><rect width="332" height="339" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M13 55Q15 33 39 38Q68 46 107 25Q125 16 137 26Q129 43 114 41Q72 51 49 62Q28 75 13 55Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M93.0 18.0L130.0 8.0M124.9 12.8L130.0 8.0l-6.8 -1.6" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Lift and stretch</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Pull one folded end</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">away from the rest of</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the warm curd to make</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">a glossy band.</text><path d="M12 113H318" stroke="#d2d8cc"/><g transform="translate(3 124.5)"><path d="M22 61Q26 45 54 42L114 24Q139 21 115 41L58 63Q39 76 22 61Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M104.0 23.0L49.0 46.0M53.4 40.5L49.0 46.0l7.0 0.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="139.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Fold back</text><text x="164" y="158.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Bring the extended end</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back over the thicker</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">end before stretching</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">again.</text><path d="M12 226H318" stroke="#d2d8cc"/><g transform="translate(3 237.5)"><circle cx="77" cy="44" r="31" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M62 67Q75 59 89 66" fill="none" stroke="#92745a" stroke-width="2" /><path d="M35.0 57.0L56.0 69.0M49.0 68.9L56.0 69.0l-3.7 -6.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="252.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Tuck underneath</text><text x="164" y="271.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Gather loose edges</text><text x="164" y="289.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">under the ball so the</text><text x="164" y="307.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">upper surface is</text><text x="164" y="325.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">smooth.</text></svg>
