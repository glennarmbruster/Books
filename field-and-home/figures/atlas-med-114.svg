<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 391" stroke-linecap="round" stroke-linejoin="round"><title>Nosebleed posture</title><desc>Nosebleed posture. Sit leaning slightly forward. Pinch the soft lower part of the nose continuously for 10–15 minutes. Seek urgent help for severe or persistent bleeding. Handle a knocked-out permanent tooth by the crown. The broad chewing end is the crown. Leave the delicate root surface alone and get emergency dental care immediately. Never replant a baby tooth.</desc><rect width="332" height="391" fill="#faf6eb"/><g transform="translate(3 38.5)"><g transform="translate(0 0) scale(1)"><circle cx="67" cy="23" r="14" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M78 22L86 30 78 31 78 36 69 38" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><path d="M61 39L52 61 76 64 88 81" fill="none" stroke="#718d85" stroke-width="7.0" /></g><path d="M80 31Q88 31 92 36L101 48 96 53 86 40 77 37Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><path d="M119.0 12.0L86.0 29.0M89.9 23.2L86.0 29.0l7.0 0.2" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Nosebleed posture</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Sit leaning slightly</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">forward. Pinch the soft</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lower part of the nose</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">continuously for 10–15</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">minutes. Seek urgent</text><text x="164" y="135.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">help for severe or</text><text x="164" y="153.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">persistent bleeding.</text><path d="M12 167H318" stroke="#d2d8cc"/><g transform="translate(3 234.0)"><path d="M48 22Q51 9 70 18Q95 7 102 22Q104 39 90 47Q87 75 78 77L72 49 63 75Q56 69 54 46Q43 36 48 22Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M128.0 17.0L102.0 25.0M106.9 20.0L102.0 25.0l6.9 1.4" fill="none" stroke="#a9492b" stroke-width="2" /><text x="115" y="68" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Root</text></g><text x="164" y="193.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Handle a</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">knocked-out</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">permanent tooth by</text><text x="164" y="250.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">the crown</text><text x="164" y="269.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The broad chewing end</text><text x="164" y="287.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">is the crown. Leave the</text><text x="164" y="305.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">delicate root surface</text><text x="164" y="323.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">alone and get</text><text x="164" y="341.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">emergency dental care</text><text x="164" y="359.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">immediately. Never</text><text x="164" y="377.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">replant a baby tooth.</text></svg>
