<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Match the carrier and care card</title><desc>Match the carrier and care card. Put the same pet name on the carrier and supplies. Keep the contact and veterinarian details readable during handoff.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="9" y="29" width="72" height="43" rx="6" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M22 30V18H57V29" fill="none" stroke="#223f3e" stroke-width="2" /><rect x="17" y="37" width="29" height="27" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="83" y="16" width="59" height="61" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="112" y="34" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">PIP</text><text x="112" y="52" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Owner</text><text x="112" y="66" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Vet</text><text x="60" y="56" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Pip</text></g></svg>
