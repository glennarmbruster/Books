<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Find the assigned muster station</title><desc>Find the assigned muster station. On the example deck plan, the marker shows station B. Confirm your own letter or number on the ship’s assigned-station information.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M6 48Q24 16 116 22L143 43 115 68Q44 78 6 48Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M35 36H114M32 53H116" fill="none" stroke="#223f3e" stroke-width="2" /><rect x="89" y="37" width="19" height="15" rx="2" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><text x="99" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">B</text><path d="M138.0 13.0L108.0 36.0M110.8 29.6L108.0 36.0l6.9 -1.1" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
