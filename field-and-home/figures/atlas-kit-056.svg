<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 280" stroke-linecap="round" stroke-linejoin="round"><title>Orient the bird first</title><desc>Orient the bird first. The wings attach at the shoulders and the legs at the hips. On the back, the backbone runs between the hips and shoulders. Locate each joint. Each side has a wing, breast, thigh and drumstick. Bend a joint to find the space between bones.</desc><rect width="332" height="280" fill="#faf6eb"/><g transform="translate(3 29.5)"><ellipse cx="74" cy="44" rx="23" ry="31" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="45" cy="34" rx="12" ry="7" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="104" cy="34" rx="12" ry="7" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="49" cy="64" rx="12" ry="14" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="99" cy="64" rx="12" ry="14" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M75 16V72" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M126.0 14.0L82.0 23.0M87.3 18.5L82.0 23.0l6.7 2.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Orient the bird first</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The wings attach at the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shoulders and the legs</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">at the hips. On the</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back, the backbone</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">runs between the hips</text><text x="164" y="135.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and shoulders.</text><path d="M12 149H318" stroke="#d2d8cc"/><g transform="translate(3 169.5)"><ellipse cx="31" cy="44" rx="17" ry="11" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="64" cy="43" rx="12" ry="22" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="97" cy="41" rx="14" ry="13" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M110 57Q114 42 126 40L138 22 143 26 132 49Q126 63 110 57Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /></g><text x="164" y="175.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Locate each joint</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Each side has a wing,</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">breast, thigh and</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">drumstick. Bend a joint</text><text x="164" y="248.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">to find the space</text><text x="164" y="266.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">between bones.</text></svg>
