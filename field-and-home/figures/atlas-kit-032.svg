<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 389" stroke-linecap="round" stroke-linejoin="round"><title>Identify the pressure indicator</title><desc>Identify the pressure indicator. Dial models have a numbered face and needle. A weighted regulator sits on the vent pipe. Check your canner’s manual for its lock and vent arrangement. Presto 01781 cover. The dial reads pressure. The regulator fits over the vent pipe. The separate air vent/cover lock rises when the canner is pressurized. Identify all three in your manual.</desc><rect width="332" height="389" fill="#faf6eb"/><g transform="translate(3 57.0)"><circle cx="43" cy="40" r="26" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M23 45L26 42M31 21L34 24M48 16V21M60 27L57 29" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M43 43L56 28" fill="none" stroke="#a9492b" stroke-width="2" /><rect x="101" y="44" width="15" height="29" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M92 46V34Q106 15 123 34V46Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /><text x="42" y="82" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Dial</text><text x="108" y="84" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Weight</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Identify the</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">pressure indicator</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Dial models have a</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">numbered face and</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">needle. A weighted</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">regulator sits on the</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">vent pipe. Check your</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">canner’s manual for its</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lock and vent</text><text x="164" y="190.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">arrangement.</text><path d="M12 204H318" stroke="#d2d8cc"/><g transform="translate(3 251.5)"><ellipse cx="70" cy="65" rx="62" ry="12" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><circle cx="42" cy="38" r="15" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M42 39L50 31" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M42 53V62" fill="none" stroke="#718d85" stroke-width="2" /><rect x="68" y="39" width="13" height="11" rx="3" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><path d="M74 52V63" fill="none" stroke="#718d85" stroke-width="3.0" /><circle cx="100" cy="60" r="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M127.0 34.0L103.0 54.0M105.6 47.5L103.0 54.0l6.9 -1.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Presto 01781 cover</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The dial reads pressure.</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The regulator fits over</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the vent pipe. The</text><text x="164" y="303.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">separate air vent/cover</text><text x="164" y="321.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lock rises when the</text><text x="164" y="339.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">canner is pressurized.</text><text x="164" y="357.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Identify all three in your</text><text x="164" y="375.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">manual.</text></svg>
