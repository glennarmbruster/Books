<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Trace the home network in connection order</title><desc>Follow the cable. Service enters the modem or ONT, then connects to the router that serves devices.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="8" y="34" width="46" height="22" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="93" y="34" width="49" height="22" rx="4" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M101 34V17M133 34V17" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M57.0 45.0L89.0 45.0M82.9 48.4L89.0 45.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /><text x="31" y="75" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Modem</text><text x="117" y="75" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Router</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Follow the cable</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Service enters the</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">modem or ONT, then</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">connects to the router</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">that serves devices.</text></svg>
