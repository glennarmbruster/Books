<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 204" stroke-linecap="round" stroke-linejoin="round"><title>Find TEST and RESET on the receptacle</title><desc>Find the buttons. Look between the two plug openings on a GFCI receptacle. Read the labels. TEST trips the device. RESET restores it when the fault is clear.</desc><rect width="332" height="204" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="40" y="2" width="69" height="86" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="50" y="9" width="49" height="70" rx="8" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M61 16V22M84 16V22M61 62V68M84 62V68" fill="none" stroke="#223f3e" stroke-width="2" /><circle cx="73" cy="26" r="2" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><circle cx="73" cy="73" r="2" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><rect x="57" y="33" width="35" height="7" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="57" y="44" width="35" height="7" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M141.0 43.0L97.0 43.0M103.1 39.6L97.0 43.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Find the buttons</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Look between the two</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">plug openings on a</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">GFCI receptacle.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 108.0)"><rect x="27" y="6" width="97" height="77" rx="5" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="40" y="15" width="72" height="23" rx="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="40" y="49" width="72" height="23" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="76" y="32" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="650">RESET</text><text x="76" y="66" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="650">TEST</text></g><text x="164" y="131.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Read the labels</text><text x="164" y="150.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">TEST trips the device.</text><text x="164" y="168.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">RESET restores it when</text><text x="164" y="186.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the fault is clear.</text></svg>
