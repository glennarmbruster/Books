<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Carry the price forward</title><desc>Carry the price forward. Example before tax. Apply each eligible discount to the amount remaining and record later rewards separately.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="74" y="26" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">List $100</text><text x="74" y="45" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Sale $80</text><text x="74" y="67" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Less $5 → $75</text></g></svg>
