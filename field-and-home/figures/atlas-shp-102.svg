<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read the mark under magnification</title><desc>Read the mark under magnification. An example 925 mark denotes a claimed silver fineness. The stamp is one clue and can be copied.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><ellipse cx="73" cy="46" rx="54" ry="21" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="48" y="33" width="51" height="23" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="73" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="650">925</text></g></svg>
