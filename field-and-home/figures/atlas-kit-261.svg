<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Track the same probe</title><desc>Track the same probe. Example readings from one roast. The rise depends on size and cooking conditions. Check actual temperature at the required point.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M22 15V73H139" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M27 63Q67 30 111 26L132 26" fill="none" stroke="#a9492b" stroke-width="2" /><text x="46" y="84" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Rest starts</text><text x="112" y="19" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">+4°F</text></g></svg>
