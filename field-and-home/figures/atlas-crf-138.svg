<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 280" stroke-linecap="round" stroke-linejoin="round"><title>Make a chain</title><desc>Make a chain. Catch the working yarn with the hook and draw it through the loop already on the shaft. One new loop remains. Start the return row. For single crochet, enter the second chain from the hook. Draw up a loop, then yarn over and draw through both loops.</desc><rect width="332" height="280" fill="#faf6eb"/><g transform="translate(3 20.5)"><path d="M132 18L64 45Q48 53 51 39" fill="none" stroke="#718d85" stroke-width="4.0" /><ellipse cx="76" cy="42" rx="10" ry="14" fill="none" stroke="#223f3e" stroke-width="1.8"/><path d="M14 70Q40 42 52 45L91 16" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M89.0 54.0L115.0 42.0M110.8 47.6L115.0 42.0l-7.0 -0.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Make a chain</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Catch the working yarn</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">with the hook and draw</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">it through the loop</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">already on the shaft.</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">One new loop remains.</text><path d="M12 131H318" stroke="#d2d8cc"/><g transform="translate(3 160.5)"><ellipse cx="37" cy="53" rx="17" ry="8" fill="none" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="62" cy="53" rx="17" ry="8" fill="none" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="87" cy="53" rx="17" ry="8" fill="none" stroke="#223f3e" stroke-width="1.8"/><path d="M122 17L64 58Q55 62 58 52" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M36.0 22.0L57.0 44.0M50.3 41.9L57.0 44.0l-1.8 -6.8" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="157.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Start the return row</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For single crochet, enter</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the second chain from</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the hook. Draw up a</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">loop, then yarn over and</text><text x="164" y="248.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">draw through both</text><text x="164" y="266.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">loops.</text></svg>
