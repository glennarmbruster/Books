<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Find the wrist pulse</title><desc>Find the wrist pulse. On a responsive person, use the pads of two fingers on the thumb side of the wrist. For a regular pulse, count 30 seconds and double. Follow emergency guidance for collapse.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><path d="M7 40Q43 40 87 34L112 23 118 25 111 33 136 34Q143 39 135 42L141 45Q143 50 134 51L136 55 121 60 94 55Q45 62 7 65Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /></g><rect x="85" y="13" width="7" height="28" rx="4" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><rect x="94" y="13" width="7" height="26" rx="4" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M120.0 12.0L102.0 33.0M103.4 26.2L102.0 33.0l6.5 -2.5" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
