<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Layer a travel cooler</title><desc>Layer a travel cooler. Put frequently used food near the top, sealed packages beneath and cold packs around them. Use a thermometer to check cooling.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="15" y="13" width="122" height="64" rx="7" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="35" y="23" width="61" height="13" rx="2" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="35" y="40" width="61" height="20" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="104" y="22" width="20" height="43" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="28" y="64" width="90" height="7" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g></svg>
