<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Stay outside an electrical hazard</title><desc>Stay outside an electrical hazard. Keep people away from downed wires and anything touching them. Call emergency services and the utility. Wait for professionals to make the scene safe.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M18 8V72M9 19H46" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M31 20Q55 28 51 55T83 68" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M98 13V78" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><circle cx="122" cy="30" r="7" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M122 38V55L113 70M122 55L131 70" fill="none" stroke="#718d85" stroke-width="4.0" /><text x="123" y="86" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Wait here</text></g></svg>
