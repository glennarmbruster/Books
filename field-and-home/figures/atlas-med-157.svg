<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Clear the space around the person</title><desc>Clear the space around the person. Move hard objects away and cushion the head. Stay nearby and time the seizure. Keep hands and objects out of the mouth and let the limbs move freely.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><ellipse cx="40" cy="49" rx="16" ry="12" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><circle cx="42" cy="46" r="9" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M56 48L86 47 106 64M84 48L119 45" fill="none" stroke="#718d85" stroke-width="8.0" /><rect x="115" y="13" width="23" height="16" rx="2" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><path d="M112.0 30.0L135.0 8.0M132.9 14.7L135.0 8.0l-6.8 1.8" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
