<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Look for a retained stinger</title><desc>Look for a retained stinger. A honeybee may leave a small dark point at the skin surface. Remove a visible stinger promptly. Severe allergic symptoms require emergency help.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="10" y="49" width="131" height="29" rx="5" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M71 57L64 35 70 34 75 53Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /><ellipse cx="66" cy="31" rx="6" ry="7" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M106.0 15.0L75.0 34.0M78.5 27.9L75.0 34.0l7.0 -0.3" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
