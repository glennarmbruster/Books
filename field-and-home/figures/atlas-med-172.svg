<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 335" stroke-linecap="round" stroke-linejoin="round"><title>Separate the part from ice water</title><desc>Separate the part from ice water. Wrap the part in clean damp material and seal it in an inner bag. Place the sealed bag in ice water and send it with the patient. Keep ice and water off the tissue. Label the handoff. Write the person’s identity and the time of injury if known on the outer container. Give the package directly to emergency responders.</desc><rect width="332" height="335" fill="#faf6eb"/><g transform="translate(3 48.0)"><rect x="18" y="13" width="118" height="65" rx="5" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="47" y="22" width="62" height="43" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="58" y="35" width="39" height="19" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="25" y="50" width="13" height="13" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="112" y="52" width="14" height="12" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M128.0 8.0L106.0 22.0M109.4 15.9L106.0 22.0l7.0 -0.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Separate the part</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">from ice water</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Wrap the part in clean</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">damp material and seal</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">it in an inner bag. Place</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the sealed bag in ice</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">water and send it with</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the patient. Keep ice</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and water off the tissue.</text><path d="M12 186H318" stroke="#d2d8cc"/><g transform="translate(3 215.5)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="75" y="28" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Patient ID</text><text x="75" y="48" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Injury time</text><text x="75" y="68" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Send with patient</text></g><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Label the handoff</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Write the person’s</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">identity and the time of</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">injury if known on the</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">outer container. Give</text><text x="164" y="303.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the package directly to</text><text x="164" y="321.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">emergency responders.</text></svg>
