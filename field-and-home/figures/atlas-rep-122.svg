<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 114" stroke-linecap="round" stroke-linejoin="round"><title>Follow the dryer exhaust all the way outside</title><desc>Clear versus crushed. A pinched section leaves much less open area for the exhaust.</desc><rect width="332" height="114" fill="#faf6eb"/><g transform="translate(3 12.0)"><rect x="6" y="17" width="40" height="54" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M46 55H72" fill="none" stroke="#718d85" stroke-width="12.0" /><path d="M72 48L91 53 106 47H132V62H106L91 57 72 61Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M132 10V77" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M132 44L146 59H132Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M92.0 16.0L92.0 48.0M88.6 41.9L92.0 48.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Clear versus</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">crushed</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">A pinched section</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">leaves much less open</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">area for the exhaust.</text></svg>
