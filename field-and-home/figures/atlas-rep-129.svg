<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 204" stroke-linecap="round" stroke-linejoin="round"><title>Match the seal to the gap</title><desc>Kerf seal. The narrow stem fits into a groove. The soft bulb stays outside. Door sweep. The fin extends below the door to meet the threshold.</desc><rect width="332" height="204" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M10 22H66V44H52V49H66V76H10Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M52 46H80" fill="none" stroke="#718d85" stroke-width="5.0" /><ellipse cx="90" cy="46" rx="14" ry="20" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="106" y="18" width="25" height="60" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Kerf seal</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The narrow stem fits</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">into a groove. The soft</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">bulb stays outside.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 108.0)"><rect x="36" y="9" width="60" height="51" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M93 43H101V60L86 80H80L94 58Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><path d="M13 80H140" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="131.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Door sweep</text><text x="164" y="150.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The fin extends below</text><text x="164" y="168.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the door to meet the</text><text x="164" y="186.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">threshold.</text></svg>
