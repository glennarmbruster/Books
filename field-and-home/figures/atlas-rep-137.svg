<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Find the specified jacking point</title><desc>Side location. The manual marks reinforced points near the wheels along the sill. Contact detail. Center the jack head on the designated point using the orientation shown in the manual.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M7 53L20 43 38 38 53 21H94L110 38 138 44V60H9Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><circle cx="34" cy="60" r="12" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><circle cx="115" cy="60" r="12" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><path d="M55.0 83.0L51.0 63.0M55.5 68.4L51.0 63.0l-2.1 6.7" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M95.0 83.0L98.0 63.0M100.4 69.6L98.0 63.0l-4.2 5.6" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Side location</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The manual marks</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">reinforced points near</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the wheels along the sill.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><path d="M19 13H119V28H79V48H69V28H19Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M51 43H65V52H83V43H96V61H51Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><path d="M74 61l-16 14 16 9 16-9Z" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Contact detail</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Center the jack head on</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the designated point</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">using the orientation</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shown in the manual.</text></svg>
