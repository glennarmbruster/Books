<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read the shelf label</title><desc>Read the shelf label. Record the item number, posted price and date checked. Ask the store about any symbol on the actual tag.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="74" y="29" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650">Item 10482</text><text x="74" y="53" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="650">$12.97</text><text x="74" y="71" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Checked Nov 16</text></g></svg>
