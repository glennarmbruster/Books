<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Locate both washer shutoffs</title><desc>Locate both washer shutoffs. Trace the hot and cold hoses to their own wall valves. Record each handle’s normal position before leaving.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="16" y="12" width="118" height="66" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="47" cy="32" r="8" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><circle cx="100" cy="32" r="8" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M38 30H57M90 30H110" fill="none" stroke="#92745a" stroke-width="4.0" /><path d="M47 41Q40 65 59 76M100 41Q94 64 108 76" fill="none" stroke="#718d85" stroke-width="2" /><text x="47" y="15" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Hot</text><text x="100" y="15" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Cold</text></g></svg>
