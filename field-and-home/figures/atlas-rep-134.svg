<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Read the pool level at the skimmer</title><desc>Pool wall. The waterline crosses the skimmer opening, allowing water to flow into the basket.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="46" y="5" width="18" height="78" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="41" y="24" width="42" height="31" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M5 39H84V83H5Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M63 26H116V68H68" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M74 48H107L100 64H80Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M11.0 38.0L55.0 38.0M48.9 41.4L55.0 38.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Pool wall</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The waterline crosses</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the skimmer opening,</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">allowing water to flow</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">into the basket.</text></svg>
