<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 281" stroke-linecap="round" stroke-linejoin="round"><title>Work out from the center</title><desc>Work out from the center. Move trapped air toward a free edge. Once adhered, fold transfer tape back close to the surface and peel steadily. Peel back low. The peeled portion folds back over itself while the applied design stays flat.</desc><rect width="332" height="281" fill="#faf6eb"/><g transform="translate(3 39.0)"><g transform="translate(0 0) scale(1)"><rect x="10" y="20" width="130" height="52" rx="3" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M12 27H138M12 66H138" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/></g><path d="M73.0 43.0L23.0 43.0M29.1 39.6L23.0 43.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M79.0 43.0L127.0 43.0M120.9 46.4L127.0 43.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Work out from the</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">center</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Move trapped air toward</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">a free edge. Once</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">adhered, fold transfer</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">tape back close to the</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">surface and peel</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">steadily.</text><path d="M12 168H318" stroke="#d2d8cc"/><g transform="translate(3 179.5)"><rect x="9" y="59" width="131" height="8" rx="1" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M12 56H108Q122 54 110 48L51 38" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M89.0 41.0L55.0 35.0M61.6 32.8L55.0 35.0l5.5 4.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Peel back low</text><text x="164" y="213.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The peeled portion folds</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back over itself while</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the applied design stays</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">flat.</text></svg>
