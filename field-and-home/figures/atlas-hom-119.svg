<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Gauge the young pod</title><desc>Gauge the young pod. Check pod length along its long axis while still tender. A typical picking size here is three to four inches.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M19 61Q44 46 113 25L125 27Q90 52 23 67Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><path d="M31 60L113 30" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M21 74H123M21 69V79M123 69V79" fill="none" stroke="#92745a" stroke-width="2" /><text x="71" y="86" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">3–4 in</text></g></svg>
