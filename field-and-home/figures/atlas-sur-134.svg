<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read the evacuation zone</title><desc>Read the evacuation zone. Example notice. Match your address to the issuing authority’s zone map, then read the action and time for that zone.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="75" y="26" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Evacuation order</text><text x="75" y="47" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="650">Zone C</text><text x="75" y="67" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Effective 16:00</text></g></svg>
