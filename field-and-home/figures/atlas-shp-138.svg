<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Add fees to the bid</title><desc>Add fees to the bid. A $100 winning bid plus a 15% premium is $115 before taxes or other fees. Set a limit using the full invoice.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="74" y="27" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Bid $100</text><text x="74" y="47" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Premium $15</text><text x="74" y="68" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Subtotal $115</text></g></svg>
