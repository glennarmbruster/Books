<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Match the leak to the part</title><desc>Top cap. Look at the vacuum breaker above the faucet body. Spout. Watch the outlet with the handle closed. Note exactly where drops form.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M15 54H86L103 71" fill="none" stroke="#718d85" stroke-width="10.0" /><rect x="61" y="27" width="28" height="12" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M75 40V53" fill="none" stroke="#718d85" stroke-width="7.0" /><path d="M108.0 9.0L85.0 29.0M87.4 22.4L85.0 29.0l6.8 -1.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Top cap</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Look at the vacuum</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">breaker above the</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">faucet body.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><path d="M15 54H86L103 71" fill="none" stroke="#718d85" stroke-width="10.0" /><rect x="61" y="27" width="28" height="12" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M75 40V53" fill="none" stroke="#718d85" stroke-width="7.0" /><path d="M104 76q-8 11 0 11q8 0 0-11Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M141.0 57.0L112.0 71.0M116.1 65.3L112.0 71.0l7.0 0.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Spout</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Watch the outlet with</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the handle closed. Note</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">exactly where drops</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">form.</text></svg>
