<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Use one scoop throughout</title><desc>Use one scoop throughout. Four scoops of coir, three compost, two perlite and one bark make ten equal parts by volume.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><text x="45" y="17" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Coir</text><text x="45" y="37" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Compost</text><text x="45" y="56" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Perlite</text><text x="45" y="76" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Bark</text><circle cx="84" cy="14" r="4" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="98" cy="14" r="4" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="112" cy="14" r="4" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="126" cy="14" r="4" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="84" cy="34" r="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="98" cy="34" r="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="112" cy="34" r="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="84" cy="54" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="98" cy="54" r="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="84" cy="74" r="4" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/></g></svg>
