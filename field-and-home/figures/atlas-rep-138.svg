<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 215" stroke-linecap="round" stroke-linejoin="round"><title>Separate engine and cabin filters</title><desc>Engine air box. Look under the hood for a housing attached to an intake duct. Cabin example. On some cars the cabin filter slides out behind the glove box. Check the manual for yours.</desc><rect width="332" height="215" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="21" y="24" width="70" height="45" rx="6" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M27 36H84M27 44H84M27 52H84" fill="none" stroke="#fffdf7" stroke-width="2" /><path d="M91 46H111L137 24" fill="none" stroke="#718d85" stroke-width="9.0" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Engine air box</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Look under the hood for</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">a housing attached to</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">an intake duct.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 113.5)"><path d="M12 22H137V67H40L26 53Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="56" y="31" width="57" height="16" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M61 35H107M61 40H107" fill="none" stroke="#718d85" stroke-width="2" /><path d="M107.0 78.0L88.0 48.0M94.1 51.4L88.0 48.0l0.5 7.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cabin example</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">On some cars the cabin</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">filter slides out behind</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the glove box. Check</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the manual for yours.</text></svg>
