<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 317" stroke-linecap="round" stroke-linejoin="round"><title>Find the two controls under a Badger 5</title><desc>Under the sink. Look below the sink flange. Both controls are on the motor base. Center socket. The wrench fits the hexagonal recess at the center. Overload reset. The small push button sits off center. The hex socket does not press in.</desc><rect width="332" height="317" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M13 7H129L118 19H30Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M5 7H145" fill="none" stroke="#223f3e" stroke-width="2" /><g transform="translate(0 0) scale(1)"><path d="M48 23L53 19H84L91 24 97 39V68Q93 77 75 79H61Q45 76 43 68V40Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><rect x="50" y="19" width="40" height="6" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="54" y="15" width="32" height="5" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="54" y="45" width="34" height="17" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="71" y="56" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="650">BADGER 5</text><path d="M47 39H93M48 67Q69 74 94 66" fill="none" stroke="#223f3e" stroke-width="2" /><rect x="95" y="34" width="8" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><path d="M103 38H117V59Q117 77 132 70Q140 67 140 57V43" fill="none" stroke="#718d85" stroke-width="5.0" /></g><path d="M40 80H101" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M8.0 74.0L38.0 77.0M31.6 79.7L38.0 77.0l-5.8 -4.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Under the sink</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Look below the sink</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">flange. Both controls are</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">on the motor base.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 108.0)"><g transform="translate(0 0) scale(1)"><ellipse cx="74" cy="46" rx="58" ry="36" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="74" cy="43" rx="54" ry="31" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M36 35Q42 20 61 18L58 30Q44 32 40 41Z" fill="#d2d8cc" stroke="#223f3e" stroke-width="1.8" /><circle cx="43" cy="32" r="2" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="72" cy="43" rx="12" ry="9" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M65 43L69 37H76L80 43 76 49H69Z" fill="#223f3e" stroke="#223f3e" stroke-width="1.8" /><ellipse cx="100" cy="56" rx="8" ry="5" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="100" cy="54" rx="5" ry="4" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/></g><path d="M30.0 85.0L67.0 50.0M64.8 56.7L67.0 50.0l-6.8 1.8" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M5 72L14 63 30 66" fill="none" stroke="#718d85" stroke-width="4.0" /><text x="23" y="52" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="650">Wrench</text></g><text x="164" y="131.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Center socket</text><text x="164" y="150.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The wrench fits the</text><text x="164" y="168.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" 