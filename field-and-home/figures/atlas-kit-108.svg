<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Inspect the surface and the liquid separately</title><desc>Inspect the surface and the liquid separately. The arrow marks raised growth on the surface. Appearance alone cannot establish safety. Discard a moldy or doubtful batch without tasting.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="35" y="10" width="79" height="70" rx="7" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="39" y="34" width="71" height="42" rx="3" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M49 36Q46 28 52 29Q55 19 60 27Q65 23 67 34Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /><circle cx="50" cy="72" r="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="58" cy="73" r="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="70" cy="71" r="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="79" cy="72" r="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="86" cy="72" r="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M103.0 11.0L66.0 28.0M70.2 22.4L66.0 28.0l7.0 0.5" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
