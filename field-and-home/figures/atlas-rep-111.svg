<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 233" stroke-linecap="round" stroke-linejoin="round"><title>Moen 1225 cartridge and retaining clip</title><desc>Cartridge ears. The two ears on the cartridge head register in the valve body. Retaining clip. The horseshoe clip crosses the body at the cartridge head. Use the maker’s orientation drawing.</desc><rect width="332" height="233" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="54" y="22" width="40" height="47" rx="6" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="65" y="6" width="17" height="20" rx="2" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="48" y="23" width="11" height="10" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="91" y="23" width="11" height="10" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M54 43H94M54 56H94" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M129.0 11.0L104.0 24.0M107.9 18.2L104.0 24.0l7.0 0.1" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cartridge ears</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The two ears on the</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cartridge head register</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">in the valve body.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 122.5)"><path d="M36 14H111V66H100V28H48V66H36Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><rect x="58" y="34" width="32" height="47" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M32 62H115" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/><path d="M128.0 12.0L109.0 19.0M113.6 13.7L109.0 19.0l6.9 1.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="128.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Retaining clip</text><text x="164" y="147.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The horseshoe clip</text><text x="164" y="165.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">crosses the body at the</text><text x="164" y="183.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cartridge head. Use the</text><text x="164" y="201.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">maker’s orientation</text><text x="164" y="219.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">drawing.</text></svg>
