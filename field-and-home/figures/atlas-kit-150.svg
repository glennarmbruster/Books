<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Use parchment handles</title><desc>Use parchment handles. Fold the last flour streaks into the batter. Leave paper extending above opposite sides of the pan so the cooled bake lifts out.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M17 30H134L124 73H27Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><path d="M12 18L30 65H119L139 17" fill="none" stroke="#fffdf7" stroke-width="2" /><path d="M29 43Q71 38 122 42L118 62H34Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /></g></svg>
