<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Separate immediate supplies</title><desc>Separate immediate supplies. Keep gloves and bleeding-control supplies in a clearly marked accessible pocket. Store routine supplies separately so they do not hide the urgent items.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="10" y="20" width="129" height="54" rx="6" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="17" y="27" width="60" height="38" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="81" y="27" width="51" height="38" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="46" y="50" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Bleeding</text><text x="106" y="50" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Routine</text></g></svg>
