<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Observe from outside</title><desc>Observe from outside. Stay well away from damaged structures and lines. From a safe distance, note the address and what you can see.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(5 4) scale(.85)"><path d="M10 43L70 7 130 43H118V84H22V43Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="34" y="46" width="22" height="20" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="80" y="47" width="21" height="37" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><path d="M8 8Q32 4 45 42T86 72" fill="none" stroke="#a9492b" stroke-width="2" /><text x="111" y="86" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Stay clear</text></g></svg>
