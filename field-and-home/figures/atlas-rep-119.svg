<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 102" stroke-linecap="round" stroke-linejoin="round"><title>Test the whole door seal</title><desc>Perimeter check. Trap the paper between the gasket and frame at each marked edge.</desc><rect width="332" height="102" fill="#faf6eb"/><g transform="translate(3 6.0)"><rect x="43" y="6" width="62" height="77" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="48" y="11" width="52" height="67" rx="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="69" y="2" width="11" height="16" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="94" y="39" width="22" height="9" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="68" y="70" width="11" height="17" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="31" y="39" width="22" height="9" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Perimeter check</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Trap the paper between</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the gasket and frame at</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">each marked edge.</text></svg>
