<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Map the two heat zones</title><desc>Map the two heat zones. Arrange fuel or lit burners on one side. The other side receives indirect heat. Place a plank according to its cooking method.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><ellipse cx="74" cy="45" rx="60" ry="34" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M74 12Q17 10 14 45Q14 74 74 78Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><path d="M74 11V79M20 29H127M15 40H133M15 51H133M21 63H126" fill="none" stroke="#223f3e" stroke-width="2" /><text x="39" y="88" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Direct</text><text x="108" y="88" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Indirect</text></g></svg>
