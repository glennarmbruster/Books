<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>See the loop below the cloth</title><desc>See the loop below the cloth. The needle passes through taut cloth. As it withdraws, a loop remains on the reverse. Keep the next travel close to the surface.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="9" y="45" width="132" height="5" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M61 10H75L71 59 65 67Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><path d="M67 14V59Q69 81 81 64L83 49" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M100.0 35.0L100.0 14.0M103.4 20.1L100.0 14.0l-3.4 6.1" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
