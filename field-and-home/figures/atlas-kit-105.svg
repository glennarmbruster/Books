<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Spot a split sauce</title><desc>Spot a split sauce. Droplets collect on the surface of a split sauce. A stable emulsion appears uniform throughout.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><ellipse cx="38" cy="46" rx="33" ry="23" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="24" cy="42" r="4" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><circle cx="42" cy="53" r="4" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><circle cx="54" cy="38" r="4" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="111" cy="46" rx="33" ry="23" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="38" y="82" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Split</text><text x="109" y="82" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Smooth</text></g></svg>
