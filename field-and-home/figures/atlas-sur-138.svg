<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 244" stroke-linecap="round" stroke-linejoin="round"><title>Drop low</title><desc>Drop low. During shaking, lower onto hands and knees if able. Protect your head and neck. Cover and hold on. Get under a sturdy table within reach. Hold a leg so you can move with it while protecting your head and neck.</desc><rect width="332" height="244" fill="#faf6eb"/><g transform="translate(3 11.5)"><circle cx="69" cy="27" r="9" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M68 36L47 49 63 62H81M65 37L81 51 91 54" fill="none" stroke="#718d85" stroke-width="6.0" /><path d="M19 68H135" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Drop low</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">During shaking, lower</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">onto hands and knees if</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">able. Protect your head</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and neck.</text><path d="M12 113H318" stroke="#d2d8cc"/><g transform="translate(3 133.5)"><rect x="18" y="20" width="117" height="7" rx="2" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><path d="M25 27V74M128 27V74" fill="none" stroke="#92745a" stroke-width="5.0" /><circle cx="77" cy="48" r="8" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M73 54L52 61 62 70H77M71 54L88 51 99 41" fill="none" stroke="#718d85" stroke-width="5.0" /><path d="M99 41L119 34 128 34" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="139.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Cover and hold on</text><text x="164" y="158.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Get under a sturdy table</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">within reach. Hold a leg</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">so you can move with it</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">while protecting your</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">head and neck.</text></svg>
