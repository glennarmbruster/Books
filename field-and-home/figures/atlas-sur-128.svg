<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Align needle and housing</title><desc>Align needle and housing. Hold the baseplate level. Turn your whole body until the north end of the needle sits in the orienting arrow. Sight along the travel arrow.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="44" y="5" width="66" height="81" rx="5" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><circle cx="77" cy="50" r="26" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M71 64L77 26 83 64Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><path d="M74 51L77 30 80 51Z" fill="#a9492b" stroke="#223f3e" stroke-width="1.8" /><path d="M77.0 23.0L77.0 7.0M80.4 13.1L77.0 7.0l-3.4 6.1" fill="none" stroke="#a9492b" stroke-width="2" /><text x="120" y="19" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Travel</text></g></svg>
