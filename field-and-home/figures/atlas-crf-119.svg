<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Protect the island and seal the edge</title><desc>Protect the island and seal the edge. Viewed from above, the center of an O remains covered. Press the stencil edge flat so paint or etching cream cannot seep beneath.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="17" y="12" width="111" height="66" rx="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="74" cy="45" rx="28" ry="23" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="74" cy="45" rx="14" ry="12" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M125.0 14.0L95.0 29.0M99.0 23.3L95.0 29.0l7.0 0.3" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M28.0 73.0L63.0 50.0M59.7 56.2L63.0 50.0l-7.0 0.6" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
