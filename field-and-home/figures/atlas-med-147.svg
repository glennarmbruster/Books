<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Decide whether movement is necessary</title><desc>Decide whether movement is necessary. Call 911. If the scene remains safe, leave the person supported where found. If immediate danger makes a move essential, follow dispatcher or trained-rescuer direction.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="7" y="17" width="56" height="50" rx="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><text x="35" y="38" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Safe</text><text x="35" y="55" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Stay</text><rect x="76" y="17" width="66" height="50" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="109" y="37" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Danger</text><text x="109" y="55" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Call 911</text></g></svg>
