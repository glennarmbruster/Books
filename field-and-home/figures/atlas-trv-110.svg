<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Locate the Austin corridor</title><desc>Locate the Austin corridor. Schematic, southeast to northwest. Brenham, Burton and Elgin are on the approach to Austin from the Friendswood area.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M125 73L85 48 64 43 44 30 24 15" fill="none" stroke="#92745a" stroke-width="2" /><circle cx="125" cy="73" r="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><circle cx="85" cy="48" r="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><circle cx="64" cy="43" r="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><circle cx="44" cy="30" r="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><circle cx="24" cy="15" r="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><text x="60" y="13" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Austin</text><text x="69" y="27" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Elgin</text><text x="90" y="40" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Burton</text><text x="116" y="52" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Brenham</text><text x="85" y="83" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Friendswood</text></g></svg>
