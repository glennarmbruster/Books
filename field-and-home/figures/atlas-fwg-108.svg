<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Separate two visible symptoms</title><desc>Separate two visible symptoms. One leaf yellows between greener veins. A dark sunken patch at a fruit’s blossom end is a different observation. Confirm the cause before treating.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M8 61Q12 14 68 22Q66 65 8 61Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><path d="M12 58L61 28M35 44L32 31M38 44L50 46" fill="none" stroke="#a9c3a1" stroke-width="2" /><circle cx="108" cy="46" r="28" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M93 66Q106 54 125 64Q114 80 93 66Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /></g></svg>
