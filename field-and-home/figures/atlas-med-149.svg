<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Protect a bleeding paw</title><desc>Protect a bleeding paw. Apply clean gauze and steady pressure and seek veterinary advice. A bandage must allow circulation. Inspect the exposed toes for swelling or coldness.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M53 10H87L89 41Q111 47 111 62Q108 76 85 76H64Q43 76 43 60Q43 48 54 40Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><rect x="47" y="44" width="55" height="17" rx="5" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><circle cx="58" cy="68" r="3" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="72" cy="70" r="3" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="86" cy="70" r="3" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><circle cx="99" cy="66" r="3" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/></g></svg>
