<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Find two ways out</title><desc>Find two ways out. Example floor plan. Trace the nearer exit and locate the alternate in case the first route is blocked. Check the posted plan in the actual building.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="134" height="73" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M8 45H48m18 0h76M82 9V32m0 16v34" fill="none" stroke="#223f3e" stroke-width="2" /></g><path d="M75 25L68 46 23 46 12 63" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/><path d="M73 24L94 44 123 44 140 23" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><text x="25" y="79" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Exit A</text><text x="120" y="15" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Exit B</text></g></svg>
