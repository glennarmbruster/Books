<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Keep the exit behind you</title><desc>Plan view. The person stands between the exit and the small fire. Keep the way back open.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M9 10H139V78H9V57M9 36V10" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M13 47H57" fill="none" stroke="#a9c3a1" stroke-width="2" stroke-dasharray="4 4"/><circle cx="65" cy="47" r="7" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><rect x="76" y="41" width="8" height="14" rx="2" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><path d="M112 60q-14-13 1-26q-1 11 6 13q10-15 8 4q-1 11-15 9Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><path d="M50.0 47.0L16.0 47.0M22.1 43.6L16.0 47.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Plan view</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The person stands</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">between the exit and the</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">small fire. Keep the way</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back open.</text></svg>
