<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 262" stroke-linecap="round" stroke-linejoin="round"><title>Trace jumper connections before attaching cables</title><desc>Positive pair. The first two connections join the discharged positive terminal to the booster positive. Final ground. Booster negative connects to the approved metal ground on the stalled vehicle, away from its battery.</desc><rect width="332" height="262" fill="#faf6eb"/><g transform="translate(3 20.5)"><g transform="translate(0 10) scale(.52)"><rect x="16" y="22" width="116" height="58" rx="6" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="26" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><rect x="99" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><text x="34" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">+</text><text x="106" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">−</text></g><g transform="translate(77 10) scale(.52)"><rect x="16" y="22" width="116" height="58" rx="6" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="26" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><rect x="99" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><text x="34" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">+</text><text x="106" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">−</text></g><path d="M18 17Q57 -1 94 17" fill="none" stroke="#a9492b" stroke-width="3.0" /><text x="28" y="80" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Vehicle</text><text x="112" y="80" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Booster</text><text x="17" y="11" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">1</text><text x="94" y="11" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">2</text></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Positive pair</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The first two</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">connections join the</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">discharged positive</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">terminal to the booster</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">positive.</text><path d="M12 131H318" stroke="#d2d8cc"/><g transform="translate(3 151.5)"><g transform="translate(77 9) scale(.50)"><rect x="16" y="22" width="116" height="58" rx="6" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="26" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><rect x="99" y="14" width="16" height="8" rx="1" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><text x="34" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">+</text><text x="106" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">−</text></g><rect x="11" y="43" width="44" height="26" rx="4" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M129 15Q64 0 33 41" fill="none" stroke="#223f3e" stroke-width="3.0" /><text x="134" y="13" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">3</text><text x="24" y="38" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">4</text></g><text x="164" y="157.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Final ground</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Booster negative</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">connects to the</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">approved metal ground</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">on the stalled vehicle,</text><text x="164" y="248.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">away from its battery.</text></svg>
