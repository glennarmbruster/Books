<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 131" stroke-linecap="round" stroke-linejoin="round"><title>Identify the slip end before positioning the coupling</title><desc>Side cutaway. One end accepts extra pipe travel so the coupling can move back across the repair gap.</desc><rect width="332" height="131" fill="#faf6eb"/><g transform="translate(3 20.5)"><rect x="39" y="24" width="78" height="45" rx="4" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><rect x="5" y="35" width="62" height="23" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="87" y="35" width="59" height="23" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M58 21V70M96 21V70" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M41.0 14.0L80.0 14.0M73.9 17.4L80.0 14.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Side cutaway</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">One end accepts extra</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">pipe travel so the</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">coupling can move</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">back across the repair</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">gap.</text></svg>
