<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 263" stroke-linecap="round" stroke-linejoin="round"><title>Center the filling</title><desc>Center the filling. Leave enough dough visible all the way around the sausage and cheese to enclose them. Bring the edges together. Raise opposite edges over the filling, pinch the seam closed, then turn it underneath.</desc><rect width="332" height="263" fill="#faf6eb"/><g transform="translate(3 20.5)"><g transform="translate(0 0) scale(1)"><ellipse cx="75" cy="47" rx="48" ry="29" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/></g><rect x="42" y="40" width="67" height="15" rx="7" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Center the filling</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Leave enough dough</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">visible all the way</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">around the sausage and</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cheese to enclose</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">them.</text><path d="M12 131H318" stroke="#d2d8cc"/><g transform="translate(3 152.0)"><path d="M23 62Q19 30 45 26L72 50 99 27Q126 30 126 61Q77 80 23 62Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M45.0 16.0L66.0 35.0M59.2 33.4L66.0 35.0l-2.3 -6.6" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M103.0 16.0L83.0 35.0M85.1 28.3L83.0 35.0l6.8 -1.8" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="157.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Bring the edges</text><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">together</text><text x="164" y="195.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Raise opposite edges</text><text x="164" y="213.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">over the filling, pinch the</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">seam closed, then turn</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">it underneath.</text></svg>
