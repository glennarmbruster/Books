<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 204" stroke-linecap="round" stroke-linejoin="round"><title>Read the coil fins edge-on</title><desc>Open channels. The gaps between intact fins are nearly parallel. Bent section. A flattened patch closes several passages at the same point.</desc><rect width="332" height="204" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M16 12V76M33 12V76M50 12V76M67 12V76M84 12V76M101 12V76M118 12V76" fill="none" stroke="#718d85" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Open channels</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The gaps between</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">intact fins are nearly</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">parallel.</text><path d="M12 102H318" stroke="#d2d8cc"/><g transform="translate(3 108.0)"><path d="M16 12V76M33 12V76M50 12V36l16 8-16 8v24M67 12V36l13 8-13 8v24M84 12V76M101 12V76M118 12V76" fill="none" stroke="#718d85" stroke-width="2" /><path d="M131.0 24.0L86.0 43.0M90.4 37.5L86.0 43.0l7.0 0.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="131.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Bent section</text><text x="164" y="150.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">A flattened patch closes</text><text x="164" y="168.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">several passages at the</text><text x="164" y="186.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">same point.</text></svg>
