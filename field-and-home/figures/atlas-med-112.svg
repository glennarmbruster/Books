<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Keep pressure off the object</title><desc>Keep pressure off the object. Side section. Leave the object in place. Bulky padding supports it on either side while you get medical help. Eye injuries need protection without pressure.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="11" y="56" width="130" height="20" rx="5" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M74 65L53 15 60 13 80 62Z" fill="#718d85" stroke="#223f3e" stroke-width="1.8" /><ellipse cx="48" cy="50" rx="18" ry="9" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="96" cy="48" rx="18" ry="10" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M130.0 22.0L108.0 40.0M110.6 33.5L108.0 40.0l6.9 -1.3" fill="none" stroke="#a9492b" stroke-width="2" /></g></svg>
