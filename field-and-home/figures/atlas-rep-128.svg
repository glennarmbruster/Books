<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Align the garage-door safety eyes</title><desc>Beam path. Follow the line between the two lenses. Objects, cobwebs or a shifted bracket can interrupt it.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><path d="M9 81V10H141V81H132V19H18V81Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><rect x="18" y="62" width="11" height="10" rx="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="121" y="62" width="11" height="10" rx="2" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><path d="M30 67H121" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M5 81H146" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Beam path</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Follow the line between</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the two lenses. Objects,</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">cobwebs or a shifted</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">bracket can interrupt it.</text></svg>
