<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 317" stroke-linecap="round" stroke-linejoin="round"><title>Find the backbone from above</title><desc>Find the backbone from above. Set the bird breast-side down. The two dotted lines run along either side of the backbone, from tail to neck. Turn and flatten. After removing the backbone, turn the breast upward. Press down as described so both halves lie flat, with the legs splayed to the sides.</desc><rect width="332" height="317" fill="#faf6eb"/><g transform="translate(3 30.0)"><ellipse cx="76" cy="47" rx="25" ry="31" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="49" cy="34" rx="12" ry="7" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="103" cy="34" rx="12" ry="7" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="47" cy="63" rx="12" ry="14" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="103" cy="63" rx="12" ry="14" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M71 17H80L83 72H69Z" fill="#92745a" stroke="#223f3e" stroke-width="1.8" /><path d="M67 19L65 70M84 18L87 70" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M135.0 12.0L86.0 26.0M91.0 21.1L86.0 26.0l6.8 1.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Find the backbone</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">from above</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Set the bird breast-side</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">down. The two dotted</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lines run along either</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">side of the backbone,</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">from tail to neck.</text><path d="M12 150H318" stroke="#d2d8cc"/><g transform="translate(3 188.5)"><ellipse cx="66" cy="44" rx="19" ry="24" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="88" cy="44" rx="19" ry="24" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="37" cy="33" rx="13" ry="6" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="115" cy="33" rx="13" ry="6" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M53 53Q33 46 29 65L11 71 14 78 38 72Q51 74 57 62ZM100 53Q120 46 122 65L140 71 139 78 115 72Q103 74 96 62Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><path d="M78 22V65" fill="none" stroke="#92745a" stroke-width="2" /></g><text x="164" y="176.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Turn and flatten</text><text x="164" y="195.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">After removing the</text><text x="164" y="213.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">backbone, turn the</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">breast upward. Press</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">down as described so</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">both halves lie flat, with</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the legs splayed to the</text><text x="164" y="303.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">sides.</text></svg>
