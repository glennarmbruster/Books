<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 131" stroke-linecap="round" stroke-linejoin="round"><title>Tell three common hand tools apart</title><desc>Look at the ends. Needle-nose pliers taper to a point. Slip-joint jaws are wider. Drivers have a single shaft.</desc><rect width="332" height="131" fill="#faf6eb"/><g transform="translate(3 20.5)"><path d="M10 72L36 40 37 13 43 38 24 74M28 72L37 42 52 18 44 44 44 75" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M67 74L82 42 79 19 94 17 88 34 98 41 103 73M71 22L70 38 85 48 89 74" fill="none" stroke="#223f3e" stroke-width="2" /><path d="M128 74V53" fill="none" stroke="#92745a" stroke-width="8.0" /><path d="M128 51V18" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M122 16H134" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Look at the ends</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Needle-nose pliers</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">taper to a point.</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Slip-joint jaws are wider.</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Drivers have a single</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shaft.</text></svg>
