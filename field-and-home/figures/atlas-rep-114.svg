<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Trace a condensate drain</title><desc>From pan to outlet. The cleanout rises from the drain line. The discharge continues outside.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="7" y="11" width="51" height="45" rx="3" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><path d="M4 55H61L57 62H9Z" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8" /><path d="M55 60H86V71H142" fill="none" stroke="#b7d9d8" stroke-width="6.0" /><path d="M77 60V33" fill="none" stroke="#b7d9d8" stroke-width="6.0" /><rect x="69" y="28" width="16" height="8" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M111 10V83" fill="none" stroke="#718d85" stroke-width="2" stroke-dasharray="4 4"/><path d="M130.0 57.0L141.0 68.0M134.3 66.0L141.0 68.0l-2.0 -6.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">From pan to outlet</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The cleanout rises from</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the drain line. The</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">discharge continues</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">outside.</text></svg>
