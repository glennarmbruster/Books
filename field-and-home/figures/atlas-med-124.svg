<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Insulate underneath as well</title><desc>Insulate underneath as well. Move to shelter if safe. Handle the person gently and add insulation below and around them while awaiting help. Keep the face uncovered.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M11 71L136 71 128 78H18Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><path d="M43 62Q68 36 112 49L136 68H38Z" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8" /><circle cx="28" cy="57" r="11" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M9 80H141" fill="none" stroke="#92745a" stroke-width="2" /></g></svg>
