<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read the resin and hardener labels</title><desc>Read the resin and hardener labels. ArtResin epoxy uses equal volumes of resin and hardener. Measure both components using the same marked scale. Other systems have different ratios.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="10" y="24" width="41" height="43" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="30" y="51" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Resin</text><rect x="56" y="24" width="43" height="43" rx="3" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><text x="78" y="50" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Hardener</text><rect x="110" y="31" width="32" height="37" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M112 38H123M112 47H123M112 56H123" fill="none" stroke="#223f3e" stroke-width="2" /></g></svg>
