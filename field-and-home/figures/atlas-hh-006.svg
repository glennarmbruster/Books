<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Sort by what the meal needs</title><desc>Sort by what the meal needs. Left to right, canned fruit can be eaten as packed, powdered milk needs safe water, and dry pasta needs water and heat.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><rect x="12" y="26" width="30" height="38" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><text x="27" y="50" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Fruit</text><rect x="55" y="23" width="37" height="42" rx="2" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><text x="73" y="48" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Milk</text><rect x="103" y="23" width="37" height="42" rx="2" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><text x="121" y="48" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Pasta</text></g></svg>
