<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 650" stroke-linecap="round" stroke-linejoin="round"><title>Adult or teen</title><desc>Adult or teen. Place the heel of one hand on the lower half of the breastbone and the other hand on top. Follow the dispatcher and allow full recoil. Child. For a child, use one or two hands on the lower half of the breastbone according to size. Compress about one-third of chest depth and give breaths if able. Infant. Use the heel of one hand or two thumbs with hands encircling the chest, according to training. Compress about one-third of chest depth. AED. Turn it on. Follow its pad pictures and prompts. For a small chest, use front and back if needed to keep pads apart. Stand clear during analysis and shock.</desc><rect width="332" height="650" fill="#faf6eb"/><g transform="translate(3 29.5)"><g transform="translate(0 0) scale(1)"><circle cx="74" cy="14" r="10" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M64 24L47 29 39 60 49 62 56 45 56 80H93V45L101 62 111 60 101 29 84 24Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /></g><rect x="65" y="43" width="19" height="9" rx="4" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><rect x="65" y="36" width="19" height="9" rx="4" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M126.0 41.0L87.0 44.0M92.9 40.2L87.0 44.0l6.4 2.9" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Adult or teen</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Place the heel of one</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">hand on the lower half of</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the breastbone and the</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">other hand on top.</text><text x="164" y="117.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Follow the dispatcher</text><text x="164" y="135.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and allow full recoil.</text><path d="M12 149H318" stroke="#d2d8cc"/><g transform="translate(3 187.5)"><g transform="translate(8 4) scale(.88)"><circle cx="74" cy="14" r="10" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M64 24L47 29 39 60 49 62 56 45 56 80H93V45L101 62 111 60 101 29 84 24Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /></g><ellipse cx="73" cy="45" rx="8" ry="5" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M124.0 40.0L85.0 45.0M90.7 40.9L85.0 45.0l6.5 2.5" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="175.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Child</text><text x="164" y="194.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For a child, use one or</text><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">two hands on the lower</text><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">half of the breastbone</text><text x="164" y="248.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">according to size.</text><text x="164" y="266.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Compress about</text><text x="164" y="284.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">one-third of chest depth</text><text x="164" y="302.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">and give breaths if able.</text><path d="M12 316H318" stroke="#d2d8cc"/><g transform="translate(3 354.5)"><ellipse cx="74" cy="51" rx="24" ry="25" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><circle cx="74" cy="16" r="13" fill="#d1a486" stroke="#223f3e" stroke-width="1.8"/><path d="M37 50Q40 32 55 35L73 44 69 49 54 44 55 60Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><path d="M112 50Q109 32 94 35L76 44 80 49 95 44 94 60Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><text x="75" y="86" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Two-thumb example</text></g><text x="164" y="342.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Infant</text><text x="164" y="361.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Use the heel of one</text><text x="164" y="379.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">hand or two thumbs</text><text x="164" y="397.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">with hands encircling</text><text x="164" y="415.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the chest, according to</text><text x="164" y="433.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">training. Compress</text><text x="164" y="451.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">about one-third of chest</text><text x="164" y="469.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">depth.</text><path d="M12 483H318" stroke="#d2d8cc"/><g transform="translate(3 521.5)"><rect x="12" y="17" width="65" height="58" rx="7" fill="#718d85" stroke="#223f3e" stroke-width="1.8"/><text x="44" y="43" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="650">AED</text><circle cx="44" cy="58" r="6" fill="#a9c3a1" stroke="#223f3e" stroke-width="1.8"/><rect x="103" y="19" width="25" height="22" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="100" y="54" width="25" height="22" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><path d="M77 50Q94 52 105 32M76 59L99 65" fill="none" stroke="#223f3e" stroke-width="2" /></g><text x="164" y="509.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">AED</text><text x="164" y="528.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Turn it on. Follow its pad</text><text x="164" y="546.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">pictures and prompts.</text><text x="164" y="564.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For a small chest, use</text><text x="164" y="582.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">front and back if needed</text><text x="164" y="600.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">to keep pads apart.</text><text x="164" y="618.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Stand clear during</text><text x="164" y="636.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">analysis and shock.</text></svg>
