<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Find the optional charge</title><desc>Find the optional charge. In this example the optional coating adds $300. Compare the written total before and after removing it.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="75" y="27" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Car $21,000</text><text x="75" y="47" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Coating $300</text><path d="M24 43H126" fill="none" stroke="#a9492b" stroke-width="2" /><text x="75" y="69" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Revised $21,000</text></g></svg>
