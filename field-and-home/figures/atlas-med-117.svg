<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Curve the SAM splint</title><desc>Curve the SAM splint. End views. A flat strip flexes easily. Forming the gentle C-curve stiffens the splint lengthwise. Follow the manufacturer’s training for placement.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><path d="M9 47H62" fill="none" stroke="#e5ae62" stroke-width="6.0" /><path d="M84 29Q88 83 133 30" fill="none" stroke="#e5ae62" stroke-width="6.0" /><text x="36" y="77" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">Flat</text><text x="110" y="77" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650">C-curve</text></g></svg>
