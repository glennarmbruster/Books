<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 113" stroke-linecap="round" stroke-linejoin="round"><title>Find the center of a wall stud</title><desc>Wall section. The wood occupies only the marked width. The adjacent cavity is hollow.</desc><rect width="332" height="113" fill="#faf6eb"/><g transform="translate(3 11.5)"><rect x="8" y="20" width="134" height="12" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><rect x="52" y="33" width="35" height="43" rx="1" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M55 35l12 33m4-35 12 23" fill="none" stroke="#92745a" stroke-width="2" /><path d="M69 5V78" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/><path d="M123.0 53.0L91.0 53.0M97.1 49.6L91.0 53.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Wall section</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The wood occupies only</text><text x="164" y="63.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the marked width. The</text><text x="164" y="81.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">adjacent cavity is</text><text x="164" y="99.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">hollow.</text></svg>
