<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Read all three notice fields</title><desc>Read all three notice fields. Example notices can say “Boil water,” “Do not drink,” or “Do not use.” Match the exact instruction, area and effective time.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><g transform="translate(0 0) scale(1)"><rect x="8" y="9" width="136" height="73" rx="6" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/></g><text x="75" y="26" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650">DO NOT USE</text><path d="M20 33H130" fill="none" stroke="#223f3e" stroke-width="2" /><text x="75" y="49" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">Zone B</text><text x="75" y="68" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650">From 07:00</text></g></svg>
