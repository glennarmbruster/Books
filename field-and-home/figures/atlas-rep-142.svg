<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 102" stroke-linecap="round" stroke-linejoin="round"><title>Identify the Klein NCVT-1P indicators</title><desc>Pen layout. The sensing tip is at the pointed end. The power button is on the barrel.</desc><rect width="332" height="102" fill="#faf6eb"/><g transform="translate(3 6.0)"><path d="M9 49L30 36H121Q139 37 139 46Q139 55 122 56H29Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><path d="M9 49L30 36 37 36 35 55 28 55Z" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8" /><circle cx="105" cy="45" r="5" fill="#223f3e" stroke="#223f3e" stroke-width="1.8"/><path d="M105.0 14.0L105.0 37.0M101.6 30.9L105.0 37.0l3.4 -6.1" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M21.0 72.0L22.0 54.0M25.0 60.3L22.0 54.0l-3.7 5.9" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="29.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Pen layout</text><text x="164" y="48.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The sensing tip is at the</text><text x="164" y="66.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">pointed end. The power</text><text x="164" y="84.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">button is on the barrel.</text></svg>
