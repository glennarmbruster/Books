<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 372" stroke-linecap="round" stroke-linejoin="round"><title>Identify both ends of an EpiPen</title><desc>Identify both ends of an EpiPen. The blue safety release comes off. Keep fingers away from the orange needle end. Use the prescribed device and call emergency services. Place at the outer thigh. For EpiPen, press the orange end firmly into the middle of the outer thigh until it clicks and hold for three seconds. Other devices have their own instructions.</desc><rect width="332" height="372" fill="#faf6eb"/><g transform="translate(3 48.0)"><path d="M25 35H119V55H25Z" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8" /><rect x="13" y="35" width="15" height="20" rx="4" fill="#b7d9d8" stroke="#223f3e" stroke-width="1.8"/><rect x="116" y="33" width="19" height="24" rx="4" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><path d="M37.0 18.0L22.0 31.0M24.4 24.4L22.0 31.0l6.8 -1.5" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M129.0 73.0L126.0 60.0M130.7 65.2L126.0 60.0l-1.9 6.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Identify both ends</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">of an EpiPen</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The blue safety release</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">comes off. Keep fingers</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">away from the orange</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">needle end. Use the</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">prescribed device and</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">call emergency</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">services.</text><path d="M12 186H318" stroke="#d2d8cc"/><g transform="translate(3 234.0)"><path d="M30 10H79L87 78H47Z" fill="#d1a486" stroke="#223f3e" stroke-width="1.8" /><rect x="94" y="39" width="43" height="12" rx="2" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><rect x="85" y="38" width="9" height="14" rx="2" fill="#a9492b" stroke="#223f3e" stroke-width="1.8"/><path d="M125.0 25.0L88.0 25.0M94.1 21.6L88.0 25.0l6.1 3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="212.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Place at the outer</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">thigh</text><text x="164" y="250.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">For EpiPen, press the</text><text x="164" y="268.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">orange end firmly into</text><text x="164" y="286.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the middle of the outer</text><text x="164" y="304.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">thigh until it clicks and</text><text x="164" y="322.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">hold for three seconds.</text><text x="164" y="340.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Other devices have</text><text x="164" y="358.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">their own instructions.</text></svg>
