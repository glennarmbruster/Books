<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 252" stroke-linecap="round" stroke-linejoin="round"><title>Gather the underside</title><desc>Gather the underside. Pull the outer edges toward one point. Turn the dough so the gathered seam rests underneath. Set it seam-down. The smooth side faces up. Flatten slightly when shaping a burger bun.</desc><rect width="332" height="252" fill="#faf6eb"/><g transform="translate(3 30.0)"><g transform="translate(0 2) scale(1)"><ellipse cx="75" cy="47" rx="48" ry="29" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/></g><path d="M39.0 34.0L64.0 43.0M57.1 44.1L64.0 43.0l-4.6 -5.2" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M108.0 34.0L87.0 44.0M91.1 38.3L87.0 44.0l7.0 0.4" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M73.0 71.0L75.0 54.0M77.6 60.5L75.0 54.0l-4.1 5.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Gather the</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">underside</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Pull the outer edges</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">toward one point. Turn</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the dough so the</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">gathered seam rests</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">underneath.</text><path d="M12 150H318" stroke="#d2d8cc"/><g transform="translate(3 156.0)"><path d="M23 62Q73 -6 127 62Q77 74 23 62Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M63 66L72 62 81 65 88 62" fill="none" stroke="#92745a" stroke-width="2" /></g><text x="164" y="179.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Set it seam-down</text><text x="164" y="198.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The smooth side faces</text><text x="164" y="216.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">up. Flatten slightly when</text><text x="164" y="234.5" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">shaping a burger bun.</text></svg>
