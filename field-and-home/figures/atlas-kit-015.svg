<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 245" stroke-linecap="round" stroke-linejoin="round"><title>Roll toward the far edge</title><desc>Roll toward the far edge. Cross section through the log. The filling or inner dough layer curls inward as you roll. Finish the seam. Pinch along the long edge and set the log seam-side down in the pan.</desc><rect width="332" height="245" fill="#faf6eb"/><g transform="translate(3 21.0)"><ellipse cx="74" cy="47" rx="40" ry="32" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M114 58Q87 87 51 63Q23 25 67 18Q108 12 105 44Q102 67 72 63Q51 60 54 40Q57 26 76 31Q90 34 84 45Q80 51 70 45" fill="none" stroke="#92745a" stroke-width="3.0" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Roll toward the far</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">edge</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Cross section through</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the log. The filling or</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">inner dough layer curls</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">inward as you roll.</text><path d="M12 132H318" stroke="#d2d8cc"/><g transform="translate(3 143.5)"><path d="M19 66Q30 12 78 20Q120 22 132 64Q80 75 19 66Z" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8" /><path d="M56 67L70 63 83 68 95 64" fill="none" stroke="#92745a" stroke-width="2" /><path d="M114.0 81.0L90.0 69.0M97.0 68.7L90.0 69.0l4.0 5.7" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="158.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Finish the seam</text><text x="164" y="177.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Pinch along the long</text><text x="164" y="195.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">edge and set the log</text><text x="164" y="213.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">seam-side down in the</text><text x="164" y="231.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">pan.</text></svg>
