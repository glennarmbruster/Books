<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 335" stroke-linecap="round" stroke-linejoin="round"><title>Pass through the same opening</title><desc>Pass through the same opening. In a saddle stitch, the two needles approach the hole from opposite faces. In an awl lockstitch the returning thread passes through the awl loop shown below. Awl loop. The awl forms a loop on the far face. Pass the separate end through that loop before withdrawing the awl.</desc><rect width="332" height="335" fill="#faf6eb"/><g transform="translate(3 57.0)"><rect x="12" y="35" width="126" height="17" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><rect x="70" y="35" width="8" height="17" rx="1" fill="#faf6eb" stroke="#223f3e" stroke-width="1.8"/><path d="M65.0 12.0L72.0 33.0M66.9 28.2L72.0 33.0l1.2 -6.9" fill="none" stroke="#a9492b" stroke-width="2" /><path d="M86.0 73.0L78.0 54.0M83.5 58.4L78.0 54.0l-0.7 7.0" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="26.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Pass through the</text><text x="164" y="45.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">same opening</text><text x="164" y="64.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">In a saddle stitch, the</text><text x="164" y="82.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">two needles approach</text><text x="164" y="100.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the hole from opposite</text><text x="164" y="118.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">faces. In an awl</text><text x="164" y="136.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">lockstitch the returning</text><text x="164" y="154.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">thread passes through</text><text x="164" y="172.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the awl loop shown</text><text x="164" y="190.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">below.</text><path d="M12 204H318" stroke="#d2d8cc"/><g transform="translate(3 224.5)"><rect x="12" y="33" width="126" height="16" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="1.8"/><path d="M73 17V56Q61 81 82 69Q87 61 77 53V19" fill="none" stroke="#92745a" stroke-width="3.0" /><path d="M26 65H125" fill="none" stroke="#718d85" stroke-width="3.0" /><path d="M50.0 58.0L71.0 58.0M64.9 61.4L71.0 58.0l-6.1 -3.4" fill="none" stroke="#a9492b" stroke-width="2" /></g><text x="164" y="230.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650">Awl loop</text><text x="164" y="249.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The awl forms a loop on</text><text x="164" y="267.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">the far face. Pass the</text><text x="164" y="285.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">separate end through</text><text x="164" y="303.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">that loop before</text><text x="164" y="321.0" text-anchor="start" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">withdrawing the awl.</text></svg>
