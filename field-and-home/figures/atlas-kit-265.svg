<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96" stroke-linecap="round" stroke-linejoin="round"><title>Watch syrup darken</title><desc>Watch syrup darken. Use the same light-colored pan for each check. Clear syrup turns straw-colored and then amber before it darkens further.</desc><rect width="180" height="96" fill="#faf6eb"/><g transform="translate(15 3)"><ellipse cx="25" cy="50" rx="21" ry="15" fill="#fffdf7" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="74" cy="50" rx="21" ry="15" fill="#e5ae62" stroke="#223f3e" stroke-width="1.8"/><ellipse cx="122" cy="50" rx="21" ry="15" fill="#92745a" stroke="#223f3e" stroke-width="1.8"/><text x="25" y="77" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Clear</text><text x="74" y="77" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Straw</text><text x="122" y="77" text-anchor="middle" fill="#223f3e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="650">Amber</text></g></svg>
