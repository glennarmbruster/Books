<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1c3457"><title>The Daily Clue · Books</title><link rel="stylesheet" href="../this-day-in-history/style.css"><link rel="stylesheet" href="style.css"></head>
<body><header><div><a href="../">‹ Bookshelf</a><strong>The Daily Clue</strong></div><nav aria-label="Calendar"><a href="#index">Date index</a><button id="today">Today</button></nav></header>
