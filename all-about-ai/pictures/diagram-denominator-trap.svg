<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">Six yes votes. Two honest percentages.</title><desc id="desc">Of twelve sites, six said yes, three said no and three did not reply. Six divided by nine replies is about 67 percent. Six divided by twelve sites is 50 percent.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Six yes votes. Two honest percentages.</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Twelve sites were asked. Nine replied. Six of those nine said yes.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Always name who you counted in the bottom number.</text>
<rect x="43" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="69" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="106" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="132" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="169" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="195" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="232" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="258" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="295" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="321" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="358" y="135" width="52" height="47" rx="5" fill="#145756" stroke="#182c2d" stroke-width="2"/>
<text x="384" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">Y</text>
<rect x="421" y="135" width="52" height="47" rx="5" fill="#8b571b" stroke="#182c2d" stroke-width="2"/>
<text x="447" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">N</text>
<rect x="484" y="135" width="52" height="47" rx="5" fill="#8b571b" stroke="#182c2d" stroke-width="2"/>
<text x="510" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">N</text>
<rect x="547" y="135" width="52" height="47" rx="5" fill="#8b571b" stroke="#182c2d" stroke-width="2"/>
<text x="573" y="168" text-anchor="middle" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="22" font-weight="700">N</text>
<rect x="610" y="135" width="52" height="47" rx="5" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="636" y="168" text-anchor="middle" fill="#182c2d" font-family="Verdana, sans-serif" font-size="22" font-weight="700">—</text>
<rect x="673" y="135" width="52" height="47" rx="5" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="699" y="168" text-anchor="middle" fill="#182c2d" font-family="Verdana, sans-serif" font-size="22" font-weight="700">—</text>
<rect x="736" y="135" width="52" height="47" rx="5" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="762" y="168" text-anchor="middle" fill="#182c2d" font-family="Verdana, sans-serif" font-size="22" font-weight="700">—</text>
<text x="45" y="218" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Y = yes     N = no     — = no reply</text>
<text x="45" y="277" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Among replies</text>
<text x="226" y="277" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="24" font-weight="700">6 ÷ 9 ≈ 67%</text>
<text x="438" y="277" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Among all sites</text>
<text x="628" y="277" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="24" font-weight="700">6 ÷ 12 = 50%</text>
</svg>
