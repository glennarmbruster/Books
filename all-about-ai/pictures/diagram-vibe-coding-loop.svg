<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Turn your idea into a working app</title><desc id="description">Describe a small job, build it, try it in a browser, and fix what went wrong. Run the same test again.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Turn your idea into a working app</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="34" y="88" width="365" height="77" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="51" y="122" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">1   Describe</text><text x="51" y="154" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">“Build a two-team counter.”</text><rect x="483" y="88" width="365" height="77" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="500" y="122" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">2   Build</text><text x="500" y="154" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Make a page with two buttons.</text><rect x="483" y="196" width="365" height="77" rx="14" fill="#ddefd9" stroke="#132f39" stroke-width="2.5"/><text x="500" y="230" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">3   Test in a browser</text><text x="500" y="262" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Press Blue twice. Look for 2.</text><rect x="34" y="196" width="365" height="77" rx="14" fill="#ffded7" stroke="#132f39" stroke-width="2.5"/><text x="51" y="230" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">4   Fix</text><text x="51" y="262" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">“One tap added two. Fix it.”</text><path d="M404 125 L473 125" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><path d="M667 168 L667 188" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><path d="M479 231 L406 231" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><path d="M210 191 L210 171" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/></svg>
