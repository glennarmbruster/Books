<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Check whether a mail move can go ahead</title><desc id="desc">A readiness report needs both a complete count and the owner’s approval. Count. 95 of 100 attempts finished. Review. The owner’s note says review pending. Decision. Hold the move until the approval is recorded.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check whether a mail move can go ahead</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A readiness report needs both a complete count and the owner’s approval.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Count</text>
<text x="55" y="177" fill="#182c2d" font-size="20">95 of 100 attempts finished.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Review</text>
<text x="55" y="276" fill="#182c2d" font-size="20">The owner’s note says review pending.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Decision</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Hold the move until the approval is recorded.</text>
</svg>
