<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Check which sources belong in a notebook</title><desc id="desc">A rumor about ticket prices can spoil an answer based on otherwise useful study notes. Inspect. Open the sources found by the search. Select. Keep the trusted help page and remove the rumor. Verify. Find the line in the help page that supports the answer.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check which sources belong in a notebook</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A rumor about ticket prices can spoil an answer based on otherwise useful</text>
<text x="28" y="107" fill="#182c2d" font-size="20">study notes.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Inspect</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Open the sources found by the search.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Select</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Keep the trusted help page and remove the rumor.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Verify</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Find the line in the help page that supports the answer.</text>
</svg>
