<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">Which copy of the project is open?</title><desc id="desc">The local task uses your open folder, including a saved draft. A cloud task starts with its connected repository and branch. A local-only file is absent.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Which copy of the project is open?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Find the file your coding helper will actually change.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">To include a local draft in a cloud task, save it to the shared branch first.</text>
<rect x="28" y="132" width="377" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="28" y="132" width="377" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="40" y="159" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Local · your folder</text>
<text x="40" y="201" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">game.html</text>
<text x="40" y="230" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">draft.txt  •  saved here only</text>
<text x="40" y="259" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Run the browser on this device.</text>
<rect x="436" y="132" width="376" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="436" y="132" width="376" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="448" y="159" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Cloud · connected repository</text>
<text x="448" y="201" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">game.html</text>
<text x="448" y="230" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">draft.txt  •  absent here</text>
<text x="448" y="259" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Review the proposed change.</text>
</svg>
