<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Check the next run of a recurring task</title><desc id="desc">The team wants a regular reminder to count returned kits. Message. Remind the team to count the kits. Repeat. Set Friday at noon UTC. Check. Open the saved task and read the next run and its time zone.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check the next run of a recurring task</text>
<text x="28" y="79" fill="#182c2d" font-size="20">The team wants a regular reminder to count returned kits.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Message</text>
<text x="55" y="177" fill="#182c2d" font-size="20">Remind the team to count the kits.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Repeat</text>
<text x="55" y="276" fill="#182c2d" font-size="20">Set Friday at noon UTC.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Check</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Open the saved task and read the next run and its time zone.</text>
</svg>
