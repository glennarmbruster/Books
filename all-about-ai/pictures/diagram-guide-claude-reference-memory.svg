<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Test a writing preference across chats</title><desc id="desc">One correct response does not tell you whether a preference carries over. First chat. Ask Claude to remember bullets for practice handoffs. New chat. Ask how to format a handoff. Compare. Check the reply against the preference you saved.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Test a writing preference across chats</text>
<text x="28" y="79" fill="#182c2d" font-size="20">One correct response does not tell you whether a preference carries over.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">First chat</text>
<text x="55" y="177" fill="#182c2d" font-size="20">Ask Claude to remember bullets for practice handoffs.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">New chat</text>
<text x="55" y="276" fill="#182c2d" font-size="20">Ask how to format a handoff.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Compare</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Check the reply against the preference you saved.</text>
</svg>
