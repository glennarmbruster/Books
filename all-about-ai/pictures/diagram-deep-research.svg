<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">From a question to a short report</title><desc id="description">Read the research plan before it starts. Check sources before trusting the finished brief.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">From a question to a short report</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="28" y="106" width="185" height="140" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="45" y="140" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Plan</text><text x="45" y="172" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Pick a question.</text><text x="45" y="199" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Name its limits.</text><path d="M214 176 L236 176" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="106" width="185" height="140" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="257" y="140" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Search</text><text x="257" y="172" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Find primary</text><text x="257" y="199" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">sources.</text><path d="M426 176 L448 176" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="452" y="106" width="185" height="140" rx="14" fill="#ddefd9" stroke="#132f39" stroke-width="2.5"/><text x="469" y="140" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Verify</text><text x="469" y="172" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Open each link.</text><text x="469" y="199" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Check the date.</text><path d="M638 176 L660 176" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="664" y="106" width="185" height="140" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="681" y="140" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Write</text><text x="681" y="172" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">State the result.</text><text x="681" y="199" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Link the proof.</text></svg>
