<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">A key changes how an adventure ends</title><desc id="desc">The player starts in the lobby. The gate only opens when the bag contains the key. Go straight to the gate. Without a key, the game ends Locked out. Visit the workshop. Pick up the key once, then go to the gate. Open the gate. The game ends Home free. Restart empties the bag.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">A key changes how an adventure ends</text>
<text x="28" y="79" fill="#182c2d" font-size="20">The player starts in the lobby. The gate only opens when the bag contains</text>
<text x="28" y="107" fill="#182c2d" font-size="20">the key.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Go straight to the gate</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Without a key, the game ends Locked out.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Visit the workshop</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Pick up the key once, then go to the gate.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Open the gate</text>
<text x="55" y="403" fill="#182c2d" font-size="20">The game ends Home free. Restart empties the bag.</text>
</svg>
