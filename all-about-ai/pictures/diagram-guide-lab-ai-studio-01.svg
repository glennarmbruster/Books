<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Read only what a travel note says</title><desc id="desc">A short note gives a meeting place and a date but leaves out the year. Place. The note names Pier 4. Date. It says March 8. Limit. Report the year as unknown.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Read only what a travel note says</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A short note gives a meeting place and a date but leaves out the year.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Place</text>
<text x="55" y="177" fill="#182c2d" font-size="20">The note names Pier 4.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Date</text>
<text x="55" y="276" fill="#182c2d" font-size="20">It says March 8.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Limit</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Report the year as unknown.</text>
</svg>
