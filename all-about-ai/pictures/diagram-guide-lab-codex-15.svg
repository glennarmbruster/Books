<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Count each mailbox ID once in a report</title><desc id="desc">Several CSV rows can name the same item. Their status must agree before the report is saved. Read. Group the rows by ID. Count. Two matching HOLD rows for B represent one ID. Stop on conflict. Keep the previous report if one ID has two different states.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Count each mailbox ID once in a report</text>
<text x="28" y="79" fill="#182c2d" font-size="20">Several CSV rows can name the same item. Their status must agree before the</text>
<text x="28" y="107" fill="#182c2d" font-size="20">report is saved.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Read</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Group the rows by ID.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Count</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Two matching HOLD rows for B represent one ID.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Stop on conflict</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Keep the previous report if one ID has two different states.</text>
</svg>
