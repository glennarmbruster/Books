<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Count the cost of one checked result</title><desc id="description">These made-up points show why a cheap try can cost more after retries. Count only results that pass.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Count the cost of one checked result</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="35" y="94" width="810" height="46" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="55" y="125" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Practice price A</text><text x="318" y="125" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">1 point × 4 tries = 4 points for one win.</text><rect x="35" y="149" width="810" height="46" rx="14" fill="#ddefd9" stroke="#132f39" stroke-width="2.5"/><text x="55" y="180" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Practice price B</text><text x="318" y="180" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">3 points × 1 try = 3 points for one win.</text><rect x="35" y="204" width="810" height="46" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="55" y="235" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">Compare the two</text><text x="318" y="235" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">Both must pass the same test to count.</text></svg>
