<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">Which copy are you playing?</title><desc id="d">Saved file. Open index.html. Check the build label. Git version. Review the edit. Commit that exact file. Published copy. Open the site URL. Test timer and replay.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">Which copy are you playing?</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Follow one game from your folder to the reader’s browser.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">Saved file</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">Open index.html.</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">Check the build label.</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Git version</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">Review the edit.</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">Commit that exact file.</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Published copy</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Open the site URL.</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">Test timer and replay.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">Repeat the same round on both copies and record the release label.</text>
