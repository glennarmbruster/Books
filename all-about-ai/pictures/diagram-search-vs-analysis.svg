<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">Where does the answer live?</title><desc id="desc">To find a public opening date, search the web and open the dated announcement. To total a sheet, add its rows with data analysis.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Where does the answer live?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Start with the evidence your question needs.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Check a public claim on its page. Check a total against its rows.</text>
<rect x="32" y="130" width="367" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="32" y="130" width="367" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="44" y="157" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Web search</text>
<text x="44" y="199" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">When does the exhibit open?</text>
<text x="44" y="228" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Find its dated announcement.</text>
<text x="44" y="257" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Read the date on that page.</text>
<rect x="442" y="130" width="365" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="442" y="130" width="365" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="454" y="157" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Data analysis · Python</text>
<text x="454" y="199" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">How many tickets sold?</text>
<text x="454" y="228" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Rows: 12, 8 and 5.</text>
<text x="454" y="257" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">12 + 8 + 5 = 25 tickets.</text>
</svg>
