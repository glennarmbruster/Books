<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Two ways to study the same sources</title>
  <desc id="description">Two selected notes feed a chat with a citation and Studio with Audio, Mind Maps, Flashcards and Slides. Both uses need a check against the source words.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Two ways to study the same sources</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Choose the notes you trust. Use their words to check any answer or study aid.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="36" y="173" width="238" height="147" rx="11" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5" />
  <rect x="36" y="173" width="6" height="147" rx="3" fill="#8b571b" stroke="#8b571b" stroke-width="0" />
  <text x="52" y="206" fill="#8b571b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Selected sources</text>
  <text x="52" y="238" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">✓  Score note</text>
  <text x="52" y="265" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">✓  Turn note</text>
  <path d="M273 245H306V178H340 M306 245V313H340" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M331 178L353 178" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M344.6 183.4L353 178L344.6 172.6" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M331 313L353 313" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M344.6 318.4L353 313L344.6 307.6" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="363" y="125" width="501" height="107" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="363" y="125" width="6" height="107" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="379" y="158" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Chat with your notes</text>
  <text x="379" y="190" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Ask for a rule. Open its citation.</text>
  <rect x="363" y="249" width="501" height="112" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="363" y="249" width="6" height="112" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="379" y="282" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Make a Studio output</text>
  <text x="379" y="314" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Audio  •  Mind Map  •  Flashcards  •  Slides</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Listen, read or quiz yourself. If a claim sounds new, find the line that supports it.</text>
</svg>
