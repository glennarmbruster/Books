<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Check a personal helper’s result</title><desc id="desc">A helper can produce a plan or a file. Each kind of result needs its own check. Choose one job. Give the helper a small, clear request. Open the result. Read the proposed plan or inspect the saved file. Decide. Compare it with the request before taking another action.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check a personal helper’s result</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A helper can produce a plan or a file. Each kind of result needs its own</text>
<text x="28" y="107" fill="#182c2d" font-size="20">check.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Choose one job</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Give the helper a small, clear request.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Open the result</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Read the proposed plan or inspect the saved file.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Decide</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Compare it with the request before taking another action.</text>
</svg>
