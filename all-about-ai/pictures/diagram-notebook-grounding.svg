<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Trace an answer to the selected note</title><desc id="description">Select the schedule and open the citation. If no selected note gives a price, leave the price unknown.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Trace an answer to the selected note</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="28" y="112" width="256" height="130" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="45" y="146" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Selected source</text><text x="45" y="178" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">☑ Schedule: Pier 6</text><text x="45" y="205" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">☐ Old flyer: Pier 3</text><path d="M285 177 L307 177" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="311" y="112" width="256" height="130" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="328" y="146" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Notebook reply</text><text x="328" y="178" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">“Meet at Pier 6.”</text><text x="328" y="205" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Open its citation.</text><path d="M568 177 L590 177" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="594" y="112" width="256" height="130" rx="14" fill="#ddefd9" stroke="#132f39" stroke-width="2.5"/><text x="611" y="146" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Check the line</text><text x="611" y="178" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Schedule says Pier 6.</text><text x="611" y="205" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Price? It never says.</text></svg>
