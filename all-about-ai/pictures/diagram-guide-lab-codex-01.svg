<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Find the last known state of each message</title><desc id="desc">One log contains lines for two messages. A later line changes only the message it names. Message A. It is queued, retried and then delivered. Message B. Its last line says queued. Check. Cite the last line for each ID separately.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Find the last known state of each message</text>
<text x="28" y="79" fill="#182c2d" font-size="20">One log contains lines for two messages. A later line changes only the</text>
<text x="28" y="107" fill="#182c2d" font-size="20">message it names.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Message A</text>
<text x="55" y="205" fill="#182c2d" font-size="20">It is queued, retried and then delivered.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Message B</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Its last line says queued.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Check</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Cite the last line for each ID separately.</text>
</svg>
