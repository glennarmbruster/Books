<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">How much fits in this turn?</title><desc id="description">A model reads pieces of text called tokens. Its context window has room for only so many pieces at once.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">How much fits in this turn?</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><text x="34" y="107" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">One possible split of “sailing”</text><rect x="40" y="129" width="100" height="56" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="90" y="164" fill="#132f39" text-anchor="middle" font-family="Verdana, sans-serif" font-size="23" font-weight="700">sail</text><rect x="148" y="129" width="88" height="56" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="192" y="164" fill="#132f39" text-anchor="middle" font-family="Verdana, sans-serif" font-size="23" font-weight="700">ing</text><path d="M250 157 L300 157" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="319" y="100" width="519" height="120" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="340" y="133" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Context window</text><text x="340" y="165" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="21" font-weight="400">Question  +  notes  +  space for a reply</text><text x="340" y="193" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Everything must fit within the limit.</text><text x="34" y="265" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Different models may split the same word in different ways.</text></svg>
