<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Match the input to the output</title>
  <desc id="description">Text can prompt an image, an image can be described in text, speech can become a transcript and a video can be studied for a scene list. Each row names a matching tool.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Match the input to the output</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">One input can serve different jobs. Choose a tool that can make the output you want.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="46" y="147" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Your input</text>
  <text x="297" y="147" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">What the tool does</text>
  <text x="644" y="147" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Wanted output</text>
