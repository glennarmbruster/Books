<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Check the first item that should cost money</title><desc id="desc">A fee rule gives the first two items free. The third costs 1.25 dollars. Zero items. The fee is 0.00. Two items. The fee must still be 0.00. Three items. The fee is 1.25. Run these cases after fixing the rule.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check the first item that should cost money</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A fee rule gives the first two items free. The third costs 1.25 dollars.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Zero items</text>
<text x="55" y="177" fill="#182c2d" font-size="20">The fee is 0.00.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Two items</text>
<text x="55" y="276" fill="#182c2d" font-size="20">The fee must still be 0.00.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Three items</text>
<text x="55" y="375" fill="#182c2d" font-size="20">The fee is 1.25. Run these cases after fixing the rule.</text>
</svg>
