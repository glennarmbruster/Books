<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Read the plan before any file changes</title>
  <desc id="description">Claude Code reads in Plan Mode and proposes three checks. A person examines the boundary case and approves the scope. Then Claude edits one file and runs the checks.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Read the plan before any file changes</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">A person decides when the next stage can begin.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="33" y="165" width="251" height="165" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="33" y="165" width="6" height="165" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="49" y="198" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Plan Mode</text>
  <text x="49" y="230" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Read the rule file.</text>
  <text x="49" y="257" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">List three tests.</text>
  <text x="49" y="284" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Files stay as they are.</text>
  <path d="M289 248L329 248" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M320.6 253.4L329 248L320.6 242.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="341" y="169" width="218" height="152" rx="26" fill="#8b571b" stroke="#8b571b" stroke-width="2" />
  <text x="450" y="219" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Your approval</text>
  <text x="450" y="256" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Check the edge case.</text>
  <text x="450" y="287" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Approve or revise.</text>
  <path d="M568 248L605 248" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M596.6 253.4L605 248L596.6 242.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="618" y="165" width="246" height="165" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="618" y="165" width="6" height="165" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="634" y="198" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Edit and test</text>
  <text x="634" y="230" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Change one file.</text>
  <text x="634" y="257" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Run the three tests.</text>
  <text x="634" y="284" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Read the results.</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">For a warning limit, test a number below it, a number on the line and a missing value.</text>
</svg>
