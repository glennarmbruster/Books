<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">How much thinking does the job need?</title><desc id="description">Try a fast choice for a small job. Try a thinking choice when several rules interact. Check either answer.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">How much thinking does the job need?</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="30" y="129" width="286" height="99" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="47" y="163" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Read the job</text><text x="47" y="195" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">What must I check?</text><path d="M319 170 L438 123" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><path d="M319 175 L438 231" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="82" width="396" height="89" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="467" y="116" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">One short task → Fast</text><text x="467" y="148" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Sort three words. Check their order.</text><rect x="450" y="191" width="396" height="89" rx="14" fill="#ddefd9" stroke="#132f39" stroke-width="2.5"/><text x="467" y="225" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Several linked rules → Think</text><text x="467" y="257" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Plan turns in a game. Play one round.</text></svg>
