<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">Which check actually passed?</title><desc id="d">First message. SPF failed. DKIM failed. Look up the clues. DN1: different IP. DN2: selector missing. Comparison: DN5. Aligned SPF passed. DMARC passed.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">Which check actually passed?</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Match the receiver’s results with the dated DNS notes.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">First message</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">SPF failed.</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">DKIM failed.</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Look up the clues</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">DN1: different IP.</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">DN2: selector missing.</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Comparison: DN5</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Aligned SPF passed.</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">DMARC passed.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">A failed DKIM check can coexist with a DMARC pass through aligned SPF.</text>
</svg>
