<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">Can you trace the time on this post?</title><desc id="desc">A repost says eight. The official post says to check the holiday timetable. The timetable lists seven for the correct route and date.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Can you trace the time on this post?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">A repost claims the last boat leaves at eight.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Keep the timetable, the travel date and the route with your answer.</text>
<rect x="28" y="141" width="237" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="28" y="141" width="237" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="40" y="168" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Repost</text>
<text x="40" y="210" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">“Last boat at 8.”</text>
<text x="40" y="239" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">No date or route.</text>
<path d="M269 206h24m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="299" y="141" width="237" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="299" y="141" width="237" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="311" y="168" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Official post</text>
<text x="311" y="210" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Holiday hours vary.</text>
<text x="311" y="239" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Open the timetable.</text>
<path d="M540 206h25m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="571" y="141" width="240" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="571" y="141" width="240" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="583" y="168" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Official timetable</text>
<text x="583" y="210" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Holiday · Route B</text>
<text x="583" y="239" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Last boat: 7:00.</text>
</svg>
