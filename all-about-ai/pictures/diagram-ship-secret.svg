<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">What can a visitor open?</title><desc id="d">Public game. HTML, CSS and script can be downloaded. Offline option. Use sample answers. Leave the key out. Online option. Server keeps the key. Browser gets the result.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">What can a visitor open?</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Decide where a private key belongs before you publish.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">Public game</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">HTML, CSS and script</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">can be downloaded.</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Offline option</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">Use sample answers.</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">Leave the key out.</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Online option</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Server keeps the key.</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">Browser gets the result.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">A secret written into the finished page is visible to anyone with a copy.</text>
</svg>
