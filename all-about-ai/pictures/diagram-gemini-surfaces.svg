<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Choose a Google workspace</title>
  <desc id="description">Gemini App handles a quick chat or draft. Notebook uses chosen sources. AI Studio tests a prompt or builds an app preview. Antigravity works across a coding project.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Choose a Google workspace</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Match what you want to make to the place where you will make it.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="42" y="127" width="814" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="42" y="127" width="245" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="56" y="158" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Gemini App</text>
  <text x="301" y="158" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Chat about a task or draft a packing list.</text>
  <rect x="42" y="184" width="814" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="42" y="184" width="245" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="56" y="215" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Gemini Notebook</text>
  <text x="301" y="215" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Study your notes and trace a claim to its source.</text>
  <rect x="42" y="241" width="814" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="42" y="241" width="245" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="56" y="272" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Google AI Studio</text>
  <text x="301" y="272" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Test a prompt and preview an app that uses it.</text>
  <rect x="42" y="298" width="814" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="42" y="298" width="245" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="56" y="329" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Antigravity</text>
  <text x="301" y="329" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Work on code and tests across your project files.</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">For a quiz based on two rule sheets, begin in Notebook and check the answers there.</text>
</svg>
