<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">Did the fix pass the control?</title><desc id="d">Predict. Receipt: Tagged Ordinary mail: Plain Observe. W3: Tagged W4: Plain Decide. Both probes passed. Other mail: unknown.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">Did the fix pass the control?</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Practice receipt: the tag went missing. Delivery itself worked.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">Predict</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">Receipt: Tagged</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">Ordinary mail: Plain</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Observe</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">W3: Tagged</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">W4: Plain</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Decide</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Both probes passed.</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">Other mail: unknown.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">Keep the old value and the two test IDs with the verdict.</text>
</svg>
