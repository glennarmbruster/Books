<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">How does the helper see your work?</title><desc id="desc">A file upload brings one copy. A connector reads allowed items in an app. The browser panel can use a permitted page.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">How does the helper see your work?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Pick the smallest window that shows the thing you want to read.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">To check one draft, uploading that one file may be enough.</text>
<rect x="28" y="132" width="249" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="28" y="132" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="40" y="159" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">File upload</text>
<text x="40" y="201" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">One saved copy</text>
<text x="40" y="230" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Draft from Monday</text>
<rect x="295" y="132" width="249" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="295" y="132" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="307" y="159" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">App connector</text>
<text x="307" y="201" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Allowed app files</text>
<text x="307" y="230" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Find a newer draft</text>
<rect x="562" y="132" width="249" height="118" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="562" y="132" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="574" y="159" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Browser panel</text>
<text x="574" y="201" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">A permitted page</text>
<text x="574" y="230" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Read the open tab</text>
</svg>
