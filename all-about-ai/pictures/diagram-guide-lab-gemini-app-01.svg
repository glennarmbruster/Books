<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Remove repeats from a packing list</title><desc id="desc">A short practice note names four things, but one appears twice. Read the note. Hat, pencil, hat, cup. Keep first mentions. Keep the first hat and skip the second. Check the list. Three items remain in order: hat, pencil, cup.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Remove repeats from a packing list</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A short practice note names four things, but one appears twice.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Read the note</text>
<text x="55" y="177" fill="#182c2d" font-size="20">Hat, pencil, hat, cup.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Keep first mentions</text>
<text x="55" y="276" fill="#182c2d" font-size="20">Keep the first hat and skip the second.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Check the list</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Three items remain in order: hat, pencil, cup.</text>
</svg>
