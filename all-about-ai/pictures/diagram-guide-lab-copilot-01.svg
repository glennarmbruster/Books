<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Separate the maintenance window from its owner</title><desc id="desc">The notice describes a search outage. It leaves one important question unanswered. Time. Search maintenance runs from 09:00 to 09:30 UTC. Service. Mail delivery continues during the work. Unknown. The notice does not name the person responsible.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Separate the maintenance window from its owner</text>
<text x="28" y="79" fill="#182c2d" font-size="20">The notice describes a search outage. It leaves one important question</text>
<text x="28" y="107" fill="#182c2d" font-size="20">unanswered.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Time</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Search maintenance runs from 09:00 to 09:30 UTC.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Service</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Mail delivery continues during the work.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Unknown</text>
<text x="55" y="403" fill="#182c2d" font-size="20">The notice does not name the person responsible.</text>
</svg>
