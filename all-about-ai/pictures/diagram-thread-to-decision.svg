<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">Which time did the team agree to?</title><desc id="desc">Mail proposes ten. Teams suggests eleven. A final reply accepts eleven. Only the last message confirms the decision.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Which time did the team agree to?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Follow this made-up thread across Mail and Teams.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Decision: 11:00. Keep the final reply with the summary.</text>
<rect x="33" y="127" width="774" height="49" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="47" y="159" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Mail · proposal</text>
<text x="337" y="159" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20" font-weight="400">“Could we meet at 10:00?”</text>
<rect x="33" y="191" width="774" height="49" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="47" y="223" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Teams · counter-offer</text>
<text x="337" y="223" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20" font-weight="400">“How about 11:00?”</text>
<rect x="33" y="255" width="774" height="49" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="47" y="287" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Mail · approval</text>
<text x="337" y="287" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20" font-weight="400">“Agreed. Book 11:00.”</text>
</svg>
