<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Carry a checked fact into a quiz</title>
  <desc id="description">A score note says that red earns 3. A quiz asks what a red card earns and marks 3 as right. In Canvas, a player answers, sees the score, and taps Play again to restart.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Carry a checked fact into a quiz</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Keep the note’s own words beside the question while you check the answer.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="34" y="149" width="245" height="142" rx="11" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5" />
  <rect x="34" y="149" width="6" height="142" rx="3" fill="#8b571b" stroke="#8b571b" stroke-width="0" />
  <text x="50" y="182" fill="#8b571b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Source line</text>
  <text x="50" y="214" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">“red earns 3”</text>
  <text x="50" y="241" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Open the score note.</text>
  <path d="M282 222L314 222" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M305.6 227.4L314 222L305.6 216.6" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="323" y="149" width="245" height="142" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="323" y="149" width="6" height="142" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="339" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Quiz card</text>
  <text x="339" y="214" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">What does red earn?</text>
  <text x="339" y="241" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Answer key = 3</text>
  <path d="M571 222L603 222" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M594.6 227.4L603 222L594.6 216.6" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="612" y="149" width="245" height="142" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="612" y="149" width="6" height="142" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="628" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Canvas game</text>
  <text x="628" y="214" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Pick an answer.</text>
  <text x="628" y="241" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">See the score.</text>
  <rect x="608" y="311" width="251" height="42" rx="18" fill="#145756" stroke="#145756" stroke-width="2" />
  <text x="733" y="340" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Play again</text>
  <path d="M734 310V290" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Finish once with every answer right. Play again, miss one, and check the new score.</text>
</svg>
