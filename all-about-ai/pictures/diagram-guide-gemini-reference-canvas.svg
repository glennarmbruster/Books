<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Test an edit in Canvas</title><desc id="desc">Canvas keeps a draft app beside the conversation so you can try its controls. Build. Ask for a counter for packed bags. Try. Tap Add bag and watch the count rise. Reset. Start over and check that the number returns to zero.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Test an edit in Canvas</text>
<text x="28" y="79" fill="#182c2d" font-size="20">Canvas keeps a draft app beside the conversation so you can try its</text>
<text x="28" y="107" fill="#182c2d" font-size="20">controls.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Build</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Ask for a counter for packed bags.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Try</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Tap Add bag and watch the count rise.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Reset</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Start over and check that the number returns to zero.</text>
</svg>
