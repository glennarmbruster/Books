<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Compare two rounds of the same memory game</title><desc id="desc">Both players get a fresh copy of the same board. The player who needs fewer tries wins. First round. Record the first player’s three tries. Second round. Reset the board and record two tries. Result. The second player wins because two is fewer than three.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Compare two rounds of the same memory game</text>
<text x="28" y="79" fill="#182c2d" font-size="20">Both players get a fresh copy of the same board. The player who needs fewer</text>
<text x="28" y="107" fill="#182c2d" font-size="20">tries wins.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">First round</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Record the first player’s three tries.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Second round</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Reset the board and record two tries.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Result</text>
<text x="55" y="403" fill="#182c2d" font-size="20">The second player wins because two is fewer than three.</text>
</svg>
