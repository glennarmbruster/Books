<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Choose where to work in Claude</title>
  <desc id="description">Chat answers a question. Project knowledge stores materials across chats. Cowork carries out a file task. Claude Code changes a coding project. Artifacts show a draft or a small app.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Choose where to work in Claude</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">A question, a folder of files and a working mini app each need a different space.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="40" y="119" width="816" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="40" y="119" width="244" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="54" y="150" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Chat</text>
  <text x="298" y="150" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Ask one question and follow up.</text>
  <rect x="40" y="169" width="816" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="40" y="169" width="244" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="54" y="200" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Project knowledge</text>
  <text x="298" y="200" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Keep a rule sheet for more than one chat.</text>
  <rect x="40" y="219" width="816" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="40" y="219" width="244" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="54" y="250" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Cowork</text>
  <text x="298" y="250" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Give Claude a file task in an allowed folder.</text>
  <rect x="40" y="269" width="816" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="40" y="269" width="244" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="54" y="300" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Claude Code</text>
  <text x="298" y="300" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Edit code and run the project’s tests.</text>
  <rect x="40" y="319" width="816" height="46" rx="6" fill="#faf6ea" stroke="#145756" stroke-width="1.6" />
  <rect x="40" y="319" width="244" height="46" rx="6" fill="#145756" stroke="#145756" stroke-width="1.6" />
  <text x="54" y="350" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Artifacts</text>
  <text x="298" y="350" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Open a draft or try a mini app as it takes shape.</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Choose Project knowledge when tomorrow’s chat needs the same reference material.</text>
</svg>
