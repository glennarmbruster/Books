<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">What may leave the case folder?</title><desc id="d">Policy. Approved tool? Allowed kind of data? Smallest useful copy. Replace identifiers. Remove entire secrets. Read it again. Can the case be solved? Log the fields shared.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">What may leave the case folder?</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Before you paste, make three decisions.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">Policy</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">Approved tool?</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">Allowed kind of data?</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Smallest useful copy</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">Replace identifiers.</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">Remove entire secrets.</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Read it again</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Can the case be solved?</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">Log the fields shared.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">If permission is unclear, keep the case local and ask the policy owner.</text>
</svg>
