<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Keep evidence beside each action on a board</title><desc id="desc">A team builds an action board from three meeting slips and exports only checked tasks. Read. Link each task to the slip that supports it. Review. Check the wording and approval on each card. Edit. If the wording changes, the card needs approval again.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Keep evidence beside each action on a board</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A team builds an action board from three meeting slips and exports only</text>
<text x="28" y="107" fill="#182c2d" font-size="20">checked tasks.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Read</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Link each task to the slip that supports it.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Review</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Check the wording and approval on each card.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Edit</text>
<text x="55" y="403" fill="#182c2d" font-size="20">If the wording changes, the card needs approval again.</text>
</svg>
