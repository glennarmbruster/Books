<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Give each fact its own box</title><desc id="description">The same three facts become named fields. The app can now read the score as a number.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#132f39"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#fffaf0" stroke="#132f39" stroke-width="2.5"/><text x="32" y="51" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Give each fact its own box</text><path d="M32 70H848" stroke="#132f39" stroke-width="2"/><rect x="30" y="105" width="360" height="135" rx="14" fill="#ffe5a6" stroke="#132f39" stroke-width="2.5"/><text x="47" y="139" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Rough note</text><text x="47" y="171" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Blue team got 4 points.</text><text x="47" y="198" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Round 2 just ended.</text><rect x="488" y="105" width="360" height="135" rx="14" fill="#d9edf7" stroke="#132f39" stroke-width="2.5"/><text x="505" y="139" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">JSON for the app</text><text x="505" y="171" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">{&quot;team&quot;:&quot;Blue&quot;,&quot;score&quot;:4,</text><text x="505" y="198" fill="#132f39" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">  &quot;round&quot;:2}</text><path d="M397 169 L478 169" fill="none" stroke="#132f39" stroke-width="3" marker-end="url(#arrow)"/><text x="438" y="148" fill="#132f39" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700">pack</text></svg>
