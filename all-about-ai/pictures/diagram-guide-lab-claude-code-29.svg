<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Score each quiz question once</title><desc id="desc">Two teams share four questions. Answering twice must never earn an extra point. Turn. Show the team and the current question. Answer. Award one point for a correct answer, then lock the buttons. Finish. Compare the totals after question four. Equal scores give a tie.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Score each quiz question once</text>
<text x="28" y="79" fill="#182c2d" font-size="20">Two teams share four questions. Answering twice must never earn an extra</text>
<text x="28" y="107" fill="#182c2d" font-size="20">point.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Turn</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Show the team and the current question.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Answer</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Award one point for a correct answer, then lock the buttons.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Finish</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Compare the totals after question four. Equal scores give a tie.</text>
</svg>
