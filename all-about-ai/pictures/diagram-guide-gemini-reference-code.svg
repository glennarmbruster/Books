<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Review a coding agent’s change</title><desc id="desc">A practice project must distinguish an empty score list from a list containing zero. Scope. Open just the practice project. Change. Ask the agent to fix the score display. Test. An empty list says No plays. One recorded zero displays 0.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Review a coding agent’s change</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A practice project must distinguish an empty score list from a list</text>
<text x="28" y="107" fill="#182c2d" font-size="20">containing zero.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Scope</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Open just the practice project.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Change</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Ask the agent to fix the score display.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Test</text>
<text x="55" y="403" fill="#182c2d" font-size="20">An empty list says No plays. One recorded zero displays 0.</text>
</svg>
