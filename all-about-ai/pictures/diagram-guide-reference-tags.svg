<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Find a reference page through a tag</title><desc id="desc">A tag groups pages about the same topic, even when they belong to different chapters. Pick a topic. For example, choose connectors. Browse. Open the tag to see the pages it covers. Read. Follow a page link to its steps, limits and sources.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Find a reference page through a tag</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A tag groups pages about the same topic, even when they belong to different</text>
<text x="28" y="107" fill="#182c2d" font-size="20">chapters.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Pick a topic</text>
<text x="55" y="205" fill="#182c2d" font-size="20">For example, choose connectors.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Browse</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Open the tag to see the pages it covers.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Read</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Follow a page link to its steps, limits and sources.</text>
</svg>
