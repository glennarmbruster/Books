<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">What did you let the helper read?</title><desc id="desc">Plain chat can read text you paste. A built-in browser helper may use a shared tab. A site-restricted extension can run on approved sites.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">What did you let the helper read?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Three ways to ask about a practice page.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Check the page and the access switch before you share.</text>
<rect x="28" y="135" width="249" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="28" y="135" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="40" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Plain chat</text>
<text x="40" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Paste one paragraph.</text>
<text x="40" y="233" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">The rest of the page</text>
<text x="40" y="262" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">stays outside it.</text>
<rect x="295" y="135" width="249" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="295" y="135" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="307" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Browser helper</text>
<text x="307" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Share this tab if</text>
<text x="307" y="233" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">the browser asks.</text>
<text x="307" y="262" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Check the tab name.</text>
<rect x="562" y="135" width="249" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="562" y="135" width="249" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="574" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Extension</text>
<text x="574" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Allow this site.</text>
<text x="574" y="233" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Keep other sites</text>
<text x="574" y="262" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">out of its reach.</text>
</svg>
