<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">How much thinking does this need?</title><desc id="desc">A simple sort can use a fast reply. A timetable with three rules deserves a thinking pass and a check against all three rules.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">How much thinking does this need?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Try the same helper on two very different jobs.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Extra thinking buys time to work. You still check the result.</text>
<rect x="30" y="126" width="369" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="42" y="153" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Fast or Instant</text>
<rect x="441" y="126" width="369" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="453" y="153" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Thinking</text>
<text x="46" y="202" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="21" font-weight="700">Sort these labels.</text>
<rect x="48" y="224" width="72" height="35" rx="4" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="84.0" y="248" text-anchor="middle" fill="#145756" font-family="Verdana, sans-serif" font-size="17" font-weight="700">C</text>
<rect x="131" y="224" width="72" height="35" rx="4" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="167.0" y="248" text-anchor="middle" fill="#145756" font-family="Verdana, sans-serif" font-size="17" font-weight="700">A</text>
<rect x="214" y="224" width="72" height="35" rx="4" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<text x="250.0" y="248" text-anchor="middle" fill="#145756" font-family="Verdana, sans-serif" font-size="17" font-weight="700">B</text>
<text x="46" y="295" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Check the order: A, B, C.</text>
<text x="456" y="202" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="21" font-weight="700">Build a timetable.</text>
<text x="458" y="234" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="400">✓  Two rooms</text>
<text x="458" y="264" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="400">✓  No overlaps</text>
<text x="458" y="294" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="400">✓  Finish by 4</text>
</svg>
