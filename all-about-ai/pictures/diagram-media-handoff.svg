<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">From one idea to a short clip</title><desc id="desc">Three storyboard beats become matching still images, then a renderer animates them. A final pass checks timing and sound.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">From one idea to a short clip</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Practice shot: a paper star unfolds on a desk.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Play the clip once with sound and once muted. Does the action still read?</text>
<rect x="28" y="145" width="236" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="28" y="145" width="236" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="40" y="172" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Storyboard</text>
<text x="40" y="214" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">1  Folded star</text>
<text x="40" y="243" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">2  Half open</text>
<text x="40" y="272" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">3  Fully open</text>
<path d="M269 215h26m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="145" width="236" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="300" y="145" width="236" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="312" y="172" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Still frames</text>
<text x="312" y="214" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Keep one desk.</text>
<text x="312" y="243" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Keep one star.</text>
<text x="312" y="272" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Match its size.</text>
<path d="M541 215h26m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="572" y="145" width="238" height="147" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="572" y="145" width="238" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="584" y="172" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Video and audio</text>
<text x="584" y="214" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Animate the folds.</text>
<text x="584" y="243" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Add a paper rustle.</text>
<text x="584" y="272" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Watch the timing.</text>
</svg>
