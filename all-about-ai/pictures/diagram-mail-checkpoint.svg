<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 345" role="img" aria-labelledby="t d" font-family="Arial, sans-serif"><title id="t">One message, two recipient paths</title><desc id="d">Same message. A subject can repeat. Match the exact ID. Two trace rows. T1: Delivered T2: Failed Next evidence. Find the matching NDR. Then test one cause.</desc>
<rect x="2" y="2" width="866" height="341" rx="13" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="25" y="44" font-size="32" fill="#182c2d" font-weight="700">One message, two recipient paths</text>
<text x="26" y="80" font-size="21" fill="#145756" font-weight="400">Follow the message ID and recipient together.</text>
<path d="M25 98H845" stroke="#8b571b" stroke-width="3"/>
<rect x="25" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="25" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="37" y="155" font-size="21" fill="#faf6ea" font-weight="700">Same message</text>
<text x="37" y="197" font-size="19" fill="#182c2d" font-weight="400">A subject can repeat.</text>
<text x="37" y="227" font-size="19" fill="#182c2d" font-weight="400">Match the exact ID.</text>
<path d="M281 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="305" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="305" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="317" y="155" font-size="21" fill="#faf6ea" font-weight="700">Two trace rows</text>
<text x="317" y="197" font-size="19" fill="#182c2d" font-weight="400">T1: Delivered</text>
<text x="317" y="227" font-size="19" fill="#182c2d" font-weight="400">T2: Failed</text>
<path d="M561 205h18m-6 -6 6 6 -6 6" stroke="#8b571b" fill="none" stroke-width="3"/>
<rect x="585" y="127" width="253" height="154" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
<rect x="585" y="127" width="253" height="40" rx="5" fill="#145756"/>
<text x="597" y="155" font-size="21" fill="#faf6ea" font-weight="700">Next evidence</text>
<text x="597" y="197" font-size="19" fill="#182c2d" font-weight="400">Find the matching NDR.</text>
<text x="597" y="227" font-size="19" fill="#182c2d" font-weight="400">Then test one cause.</text>
<text x="25" y="319" font-size="19" fill="#182c2d" font-weight="700">The failed row alone cannot tell you why delivery failed.</text>
</svg>
