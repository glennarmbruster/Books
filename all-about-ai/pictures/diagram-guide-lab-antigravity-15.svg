<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 421" font-family="Verdana, sans-serif">
<title id="title">Resume an import after an interruption</title><desc id="desc">A saved marker tells the next run which rows have already been counted. Before the stop. Two rows are saved. Their total is 5. Resume. Read marker 2 and process the next row. Verify. Three rows now total 10. The first two appear only once.</desc>
<rect x="2" y="2" width="956" height="417" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Resume an import after an interruption</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A saved marker tells the next run which rows have already been counted.</text>
<rect x="24" y="112" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 129v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="147" fill="#145756" font-size="22" font-weight="bold">Before the stop</text>
<text x="55" y="177" fill="#182c2d" font-size="20">Two rows are saved. Their total is 5.</text>
<rect x="24" y="211" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 228v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="246" fill="#145756" font-size="22" font-weight="bold">Resume</text>
<text x="55" y="276" fill="#182c2d" font-size="20">Read marker 2 and process the next row.</text>
<rect x="24" y="310" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 327v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="345" fill="#145756" font-size="22" font-weight="bold">Verify</text>
<text x="55" y="375" fill="#182c2d" font-size="20">Three rows now total 10. The first two appear only once.</text>
</svg>
